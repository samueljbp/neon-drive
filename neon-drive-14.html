  392.00,0,493.88,0, 587.33,0,783.99,0, 698.46,0,587.33,0, 493.88,0,0,0,
  659.25,0,659.25,0, 830.61,0,987.77,0, 659.25,0,0,0,    0,0,0,0
];
function scheduleMusic(){
  if(!AC) return;
  var t=AC.currentTime;
  if(nextNote<t) nextNote=t+0.05;
  var guard=0;
  while(nextNote<t+0.25 && guard++<12){
    var s16=mstep%16, bar=Math.floor(mstep/16)%8, pos=mstep%128;
    if(s16===0) pad(PADS[bar], nextNote, 1.85);
    if(s16%4===0) kick(nextNote);
    if(s16===4||s16===12) snare(nextNote);
    if(s16%2===1) hat(nextNote, s16===7||s16===15);
    if(s16%2===0) bass(ROOTS[bar]*((s16===6||s16===14)?2:1), nextNote, 0.20);
    if(s16%2===1) lead(PADS[bar][((mstep>>1)%3)]*2, nextNote, 0.09, 0.022);   // arpejo de fundo
    var mn=MEL[pos];
    if(mn) lead(mn, nextNote, 0.30, state==='play'?0.078:0.050);              // melodia
    if(bar===7 && s16>=12)                                                    // virada de tom
      burst(NB.s, nextNote, 0.06, 'bandpass', 380+(s16-12)*270, 1.2, 0.24);
    nextNote+=0.1153; mstep++;   // ~130 BPM
  }
}

function sfxCrash(){
  if(!AC) return;
  var t=AC.currentTime;
  var n=AC.createBufferSource(); n.buffer=NB.m;
  var f=AC.createBiquadFilter(); f.type='lowpass';
  f.frequency.setValueAtTime(2800,t); f.frequency.exponentialRampToValueAtTime(180,t+0.40);
  var g=AC.createGain(); g.gain.setValueAtTime(0.7,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.45);
  n.connect(f); f.connect(g); g.connect(sfxGain); g.connect(spaceIn); n.start(t); n.stop(t+0.5);
  var o=AC.createOscillator(); o.type='square';
  o.frequency.setValueAtTime(120,t); o.frequency.exponentialRampToValueAtTime(40,t+0.25);
  var og=AC.createGain(); og.gain.setValueAtTime(0.35,t); og.gain.exponentialRampToValueAtTime(0.001,t+0.28);
  o.connect(og); og.connect(sfxGain); o.start(t); o.stop(t+0.32);
}
function sfxCheckpoint(){
  if(!AC) return;
  var t=AC.currentTime, n=[880,1174.7,1760];
  for(var i=0;i<3;i++){
    var o=AC.createOscillator(); o.type='square'; o.frequency.value=n[i];
    var g=AC.createGain();
    g.gain.setValueAtTime(0.0001,t+i*0.10); g.gain.exponentialRampToValueAtTime(0.22,t+i*0.10+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+i*0.10+(i===2?0.34:0.16));
    o.connect(g); g.connect(sfxGain); g.connect(spaceIn);
    o.start(t+i*0.10); o.stop(t+i*0.10+0.4);
  }
}

/* ---------- física / atualização ---------- */
var STEP=1/60;

function autoDrive(){
  var seg=findSegment(position+playerZ());
  ctrl.gas=true;
  ctrl.left  = playerX >  seg.curve*0.10+0.02;
  ctrl.right = playerX <  seg.curve*0.10-0.02;
  ctrl.brake=false; ctrl.nitro=false; ctrl.drift=false;
}
/* distância real da câmera ao carro, em unidades de mundo. Não pode carregar
   cameraDepth: senão ela cancela na escala e o carro do jogador para de
   acompanhar a abertura de FOV que encolhe todo o resto da cena. */
function playerZ(){ return camDist*REFDEPTH; }

function update(dt){
  var i;
  ctrl.left=ctrl.right=ctrl.gas=ctrl.brake=ctrl.nitro=ctrl.drift=false;
  ctrl.gasA=0; ctrl.brakeA=0;
  if(state==='play'){
    var KK=keys[curP];
    ctrl.left=KK.left; ctrl.right=KK.right;
    ctrl.gas = KK.gas; ctrl.brake=KK.brake;
    ctrl.nitro=KK.nitro; ctrl.drift=KK.drift;
    ctrl.gasA=KK.gas?1:0; ctrl.brakeA=KK.brake?1:0;
    readGamepad(curP);
    if(ctrl.brake) ctrl.gas=false;
    if(pDead){ ctrl.gas=false; ctrl.nitro=false; ctrl.brake=true; }
  } else {
    autoDrive(); ctrl.gasA=1;
  }

  var pZ=playerZ();
  var seg=findSegment(position+pZ);
  var sp = speed/maxSpeed;
  curBiome = seg.biome;
  var dx = dt*2.1*sp;

  /* nitro: cada carga vale um disparo de duração fixa */
  if(ctrl.nitro){
    if(!nitroLatch && boostT<=0 && nitroCharges>0 && speed>maxSpeed*0.20){
      nitroCharges--; boostT=2.4;
    }
    nitroLatch=1;
  } else nitroLatch=0;
  if(boostT>0){ boostT-=dt; boosting=Math.min(1,boosting+dt*5); }
  else boosting=Math.max(0,boosting-dt*2.2);
  for(var pu=0;pu<pickups.length;pu++)
    if(pickups[pu].taken){ pickups[pu].t-=dt; if(pickups[pu].t<=0) pickups[pu].taken=0; }

  var topSpeed = maxSpeed*(1+boosting*0.35);

  /* aceleração */
  if(ctrl.gas)        speed += accelRate*dt*(1+boosting*0.9)*(0.25+0.75*ctrl.gasA);
  else if(ctrl.brake) speed += brakeRate*dt*(0.25+0.75*ctrl.brakeA);
  else                speed += decelRate*dt;

  /* direção */
  var steer=0;
  if(ctrl.left)  steer=-1;
  if(ctrl.right) steer= 1;
  var grip = ctrl.drift?0.55:1;
  playerX += steer*dx*steerResp*DF().grip*grip;
  playerX -= dx*sp*seg.curve*DF().cent;

  /* derrapagem */
  var wantDrift = Math.abs(steer)>0 && sp>0.42 && (ctrl.drift || Math.abs(seg.curve)>3.4);
  if(wantDrift){
    driftPower = Math.min(1, driftPower + dt*1.5);
    driftAngle = lerp(driftAngle, steer*0.30*driftPower, dt*6);
    if(ctrl.drift) speed -= maxSpeed*0.11*dt;
  } else {
    driftPower = Math.max(0, driftPower - dt*2.2);
    driftAngle = lerp(driftAngle, -seg.curve*0.012*sp, dt*5);
  }

  /* fora da pista */
  var off = Math.abs(playerX)>1;
  if(off && speed>offRoadLimit){
    speed += offRoadDecel*dt;
    shake = Math.min(1, shake+dt*3.2);
    if(Math.random()<0.5) addDust(rand(-1,1));
  }
  playerX = clamp(playerX,-2.4,2.4);

  /* guarda-corpo: barreira contínua, raspa e freia */
  if(railSfx>0) railSfx-=dt;
  var RAIL=1.12;
  if(Math.abs(playerX) > RAIL){
    playerX = (playerX>0?1:-1)*RAIL;
    if(speed > maxSpeed*0.08){
      speed -= speed*Math.min(0.55, dt*3.4);
      shake=Math.max(shake,0.75); flash=Math.max(flash,0.22);
      combo=1; comboTimer=0; driftPower=0;
      for(var rq=0;rq<3;rq++) addSpark();
      if(railSfx<=0){ sfxCrash(); railSfx=0.60; }
    }
  }
  speed = clamp(speed, 0, topSpeed);

  /* avanço */
  var moved = dt*speed;
  position = increase(position, moved, trackLength);
  distance += moved;
  dayPhase = increase(dayPhase, moved/(trackLength*1.85), 1);

  /* volta */
  var newLap = Math.floor(distance/trackLength)+1;
  if(newLap>laps){ laps=newLap; }

  /* tráfego */
  for(i=0;i<traffic.length;i++){
    var c=traffic[i];
    c.z = increase(c.z, dt*c.speed, trackLength);
    if(c.hit>0) c.hit-=dt;
    // desvio simples do jogador
    var rel = c.z - position;
    if(rel<0) rel += trackLength;
    if(rel > SEGLEN*40) c.grazed=0;
    c.laneT -= dt;                                  // troca de faixa esporádica, própria dele
    if(c.laneT<=0){
      c.laneT = rand(7,22);
      c.lane = clamp(c.lane + (Math.random()<0.5?-0.62:0.62), -0.70, 0.70);
    }
    c.offset = lerp(c.offset, c.lane, dt*0.9);      // segue a própria faixa; não foge mais de você
  }
  syncTraffic();

  /* colisão */
  if(crashCool>0) crashCool-=dt;
  var pSeg = findSegment(position+pZ);
  var win = SEGLEN*1.1 + speed*dt;                  // alcance = 1 segmento + o que anda no quadro
  var segSpan = Math.ceil(win/SEGLEN)+1;
  for(var li=-segSpan; li<=segSpan; li++){
    var cars=segments[((pSeg.index+li)%segments.length+segments.length)%segments.length].cars;
    for(i=0;i<cars.length;i++){
      var car=cars[i];
      var rel2 = car.z - position; if(rel2<0) rel2 += trackLength;
      if(Math.abs(rel2-pZ) > win) continue;
      var d = Math.abs(playerX - car.offset);
      if(d < 0.36){
        if(crashCool<=0 && speed>car.speed*0.55){
          speed = speed*DF().crash;
          crashCool=0.9; shake=1; flash=0.7; combo=1; comboTimer=0;
          driftPower=0; playerX += (playerX>car.offset?0.30:-0.30);
          for(var kk=0;kk<26;kk++) addSpark();
          sfxCrash();
        }
      } else if(d<0.62 && speed>car.speed && crashCool<=0){
        if(!car.grazed){
          car.grazed=1; combo=Math.min(9,combo+1); comboTimer=2.2;
          score += 120*combo;
          addFloat('QUASE! x'+combo);
        }
      }
      if(d>0.9) car.grazed=0;
    }
  }

  /* objetos do cenário e cápsulas de nitro */
  var oi,oj,ob,sg;
  for(oi=-segSpan; oi<=segSpan; oi++){
    sg=segments[((pSeg.index+oi)%segments.length+segments.length)%segments.length];
    var rel3=sg.index*SEGLEN - position; if(rel3<0) rel3+=trackLength;
    if(Math.abs(rel3-pZ)>win) continue;
    for(oj=0;oj<sg.sprites.length;oj++){
      ob=sg.sprites[oj];
      if(ob.pk){
        if(!ob.pk.taken && Math.abs(playerX-ob.offset)<0.38){
          ob.pk.taken=1; ob.pk.t=16;
          nitroCharges=Math.min(NITRO_MAX,nitroCharges+1);
          score+=500; addFloat('NITRO +1'); sfxCheckpoint();
        }
        continue;
      }
      if(!ob.hitW || crashCool>0) continue;
      if(Math.abs(playerX-ob.offset) < ob.hitW+0.19){
        combo=1; comboTimer=0; driftPower=0;
        if(ob.hard){
          speed*=DF().crash*0.65; crashCool=1.0; shake=1; flash=0.85;
          playerX += (playerX>0?-0.24:0.24);
          for(var q1=0;q1<30;q1++) addSpark();
          sfxCrash();
        } else {
          speed -= speed*0.32; shake=Math.max(shake,0.70); flash=Math.max(flash,0.26);
          playerX += (playerX>0?-0.06:0.06);
          for(var q2=0;q2<6;q2++) addSpark();
          if(railSfx<=0){ sfxCrash(); railSfx=0.55; }
        }
        break;
      }
    }
    if(crashCool>0) break;
  }

  /* pontuação */
  score += moved*0.008*combo*(1+boosting);
  if(comboTimer>0){ comboTimer-=dt; if(comboTimer<=0) combo=1; }
  if(driftPower>0.5) score += dt*90*driftPower;

  /* tempo e checkpoints */
  if(state==='play'){
    timeLeft -= dt;
    totalTime += dt;
    var cpIdx = Math.floor(distance/(trackLength/4));
    if(cpIdx>checkpoint){
      checkpoint=cpIdx; timeLeft += DF().cp; checkpointFlash=1.6;
      score += 2500; sfxCheckpoint();
    }
    if(timeLeft<=0){ timeLeft=0; pDead=1; }
  }

  visYaw = lerp(visYaw, clamp((ctrl.right?1:0)-(ctrl.left?1:0)+driftAngle*2.6,-1,1), dt*8);

  /* efeitos */
  shake = Math.max(0, shake - dt*2.4);
  flash = Math.max(0, flash - dt*2.6);
  checkpointFlash = Math.max(0, checkpointFlash - dt);
  sunPulse += dt;
  fovDyn = lerp(fovDyn, sp*0.70 + boosting*0.70, dt*3);
  cameraDepth = 1/Math.tan(((100 + fovDyn*20)/2)*PI/180);

  bgX -= seg.curve*sp*dt*280;
  bgY = lerp(bgY, clamp(seg.p1.world.y/9000,-1,1), dt*2.5);
  sunOffset = lerp(sunOffset, clamp(-seg.curve*0.055*sp,-0.30,0.30), dt*1.5);

  /* partículas */
  if(driftPower>0.35 && sp>0.4){
    if(Math.random()<0.85) addSmoke();
    score += 0;
  }
  updateParticles(dt);
}

function addSmoke(){
  particles.push({ x:rand(0.32,0.68), y:rand(0.86,0.94), vx:rand(-0.10,0.10), vy:rand(-0.05,-0.14),
    life:1, size:rand(0.02,0.055), type:0 });
}
function addDust(side){
  particles.push({ x:0.5+side*rand(0.16,0.28), y:rand(0.87,0.95), vx:side*rand(0.05,0.22), vy:rand(-0.10,-0.24),
    life:1, size:rand(0.012,0.032), type:1 });
}
function addSpark(){
  sparks.push({ x:0.5+rand(-0.10,0.10), y:rand(0.72,0.86), vx:rand(-0.55,0.55), vy:rand(-0.75,0.15),
    life:1, size:rand(1.5,4.2) });
}
var floats=[];
function addFloat(txt){ floats.push({txt:txt, life:1, y:0.60, x:0.5+rand(-0.08,0.08)}); }

function updateParticles(dt){
  var i;
  for(i=particles.length-1;i>=0;i--){
    var p=particles[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=dt*0.06; p.size+=dt*0.045; p.life-=dt*(p.type?1.6:1.1);
    if(p.life<=0) particles.splice(i,1);
  }
  for(i=sparks.length-1;i>=0;i--){
    var s=sparks[i];
    s.x+=s.vx*dt; s.y+=s.vy*dt; s.vy+=dt*1.5; s.life-=dt*1.5;
    if(s.life<=0) sparks.splice(i,1);
  }
  for(i=floats.length-1;i>=0;i--){
    floats[i].life-=dt*0.8; floats[i].y-=dt*0.05;
    if(floats[i].life<=0) floats.splice(i,1);
  }
  if(particles.length>170) particles.splice(0,particles.length-170);
}

/* ---------- projeção ---------- */
function project(p, camX, camY, camZ){
  p.camera.x = 0 - camX;
  p.camera.y = p.world.y - camY;
  p.camera.z = p.world.z - camZ;
  var sc = cameraDepth/Math.max(p.camera.z, 1);
  p.screen.scale = sc;
  p.screen.x = (W/2) + (sc*p.camera.x*W/2);
  p.screen.y = (H*(0.5-camPitch)) - (sc*p.camera.y*H/2);
  p.screen.w = (sc*ROADW*W/2);
}

/* ---------- desenho da pista ---------- */
function poly(g,x1,y1,x2,y2,x3,y3,x4,y4,color){
  g.fillStyle=color; g.beginPath();
  g.moveTo(x1,y1); g.lineTo(x2,y2); g.lineTo(x3,y3); g.lineTo(x4,y4);
  g.closePath(); g.fill();
}

var Ccol={g1:[],g2:[]}, tunH=1;
function frameColors(){
  var bi,tt;
  for(bi=0;bi<BIOMES.length;bi++){
    tt=BIOMES[bi].g;
    Ccol.g1[bi]=css([clamp(pal.g1[0]*tt[0],0,255),clamp(pal.g1[1]*tt[1],0,255),clamp(pal.g1[2]*tt[2],0,255)]);
    Ccol.g2[bi]=css([clamp(pal.g2[0]*tt[0],0,255),clamp(pal.g2[1]*tt[1],0,255),clamp(pal.g2[2]*tt[2],0,255)]);
  }
  tt=BIOMES[BIOME_TUNNEL].g;
  Ccol.wall=css([clamp(pal.g1[0]*tt[0]*1.7,0,255),clamp(pal.g1[1]*tt[1]*1.7,0,255),clamp(pal.g1[2]*tt[2]*1.9,0,255)]);
  Ccol.ceil=css([clamp(pal.g1[0]*tt[0]*0.7,0,255),clamp(pal.g1[1]*tt[1]*0.7,0,255),clamp(pal.g1[2]*tt[2]*0.8,0,255)]);
  Ccol.tneon=css(pal.neon,0.95);
  Ccol.tlight=css(pal.sun1,0.9);
  tunH = 1.20*H/Math.max(W,1);       // altura do túnel em unidades de meia-largura de pista
  Ccol.road1=css(pal.road1); Ccol.road2=css(pal.road2);
  Ccol.rumbleA=css(pal.rumble1); Ccol.rumbleB=css(pal.rumble2);
  Ccol.lane=css(pal.lane,0.55); Ccol.neon=css(pal.neon);
  Ccol.fog=css(pal.fog); Ccol.horizon=css(pal.horizon);
}

var horizonY=0;
function renderRoad(){
  var pZ=playerZ();
  var baseSeg=findSegment(position);
  var basePct=(position%SEGLEN)/SEGLEN;
  var pSeg=findSegment(position+pZ);
  var pPct=((position+pZ)%SEGLEN)/SEGLEN;
  var playerY=lerp(pSeg.p1.world.y,pSeg.p2.world.y,pPct);
  var maxy=H, x=0, dxc=-(baseSeg.curve*basePct);
  var n, seg;

  for(n=0;n<drawDist;n++){
    seg = segments[(baseSeg.index+n)%segments.length];
    seg.looped = seg.index < baseSeg.index;
    seg.clip = maxy;
    var camZ = position - (seg.looped?trackLength:0);
    project(seg.p1, (playerX*ROADW)-x,        playerY+camHeight, camZ);
    project(seg.p2, (playerX*ROADW)-x-dxc,    playerY+camHeight, camZ);
    x += dxc; dxc += seg.curve;
    if(seg.p1.camera.z<=cameraDepth || seg.p2.screen.y>=seg.p1.screen.y || seg.p2.screen.y>=maxy) continue;
    drawSegment(seg, n);
    maxy = seg.p2.screen.y;
  }
  horizonY = maxy;

  // névoa atmosférica no horizonte
  var fg=sctx.createLinearGradient(0,horizonY-2,0,horizonY+H*0.30);
  fg.addColorStop(0, css(pal.fog,0.92));
  fg.addColorStop(0.45, css(pal.fog,0.34));
  fg.addColorStop(1, css(pal.fog,0));
  sctx.fillStyle=fg; sctx.fillRect(0,horizonY-2,W,H*0.30);

  // objetos e carros, do fundo para a frente
  for(n=drawDist-1;n>0;n--){
    seg = segments[(baseSeg.index+n)%segments.length];
    if(seg.p1.camera.z<=cameraDepth) continue;
    var fade = clamp((1-n/drawDist)*2.4,0,1);
    if(fade<=0.02) continue;
    if(seg.biome===BIOME_TUNNEL) drawTunnel(seg);
    var si, sp3;
    for(si=0; si<seg.sprites.length; si++){
      sp3=seg.sprites[si];
      if(sp3.pk && sp3.pk.taken) continue;
      drawSprite(seg, sp3.sprite, sp3.offset, seg.clip, fade);
    }
    for(si=0; si<seg.cars.length; si++){
      var car=seg.cars[si];
      drawSprite(seg, car.sprite, car.offset, seg.clip, fade);
    }
  }
}

function drawSegment(seg,n){
  var p1=seg.p1.screen, p2=seg.p2.screen;
  var y1=p1.y, y2=p2.y, hgt=Math.ceil(y1-y2)+1;
  var alt = seg.color===1;

  // terreno
  sctx.fillStyle = alt?Ccol.g2[seg.biome]:Ccol.g1[seg.biome];
  sctx.fillRect(0, y2, W, hgt);

  // grade neon no chão (bioma noturno / cidade)
  if(pal.star>0.35 && seg.index%4===0){
    sctx.fillStyle = css(pal.neon, 0.10*pal.star);
    sctx.fillRect(0, y2, W, Math.max(1,hgt*0.5));
  }

  // pista
  poly(sctx, p1.x-p1.w, y1, p1.x+p1.w, y1, p2.x+p2.w, y2, p2.x-p2.w, y2, alt?Ccol.road2:Ccol.road1);

  // zebra / rumble
  var r1=p1.w/9, r2=p2.w/9;
  var rc = alt?Ccol.rumbleA:Ccol.rumbleB;
  poly(sctx, p1.x-p1.w-r1,y1, p1.x-p1.w,y1, p2.x-p2.w,y2, p2.x-p2.w-r2,y2, rc);
  poly(sctx, p1.x+p1.w+r1,y1, p1.x+p1.w,y1, p2.x+p2.w,y2, p2.x+p2.w+r2,y2, rc);

  // fita de neon nas bordas (cena + emissiva)
  var e1=p1.w*0.035, e2=p2.w*0.035;
  var neon = css(pal.neon, 0.95);
  poly(sctx, p1.x-p1.w,y1, p1.x-p1.w+e1,y1, p2.x-p2.w+e2,y2, p2.x-p2.w,y2, neon);
  poly(sctx, p1.x+p1.w,y1, p1.x+p1.w-e1,y1, p2.x+p2.w-e2,y2, p2.x+p2.w,y2, neon);
  if(n<170){
    poly(ectx, p1.x-p1.w,y1, p1.x-p1.w+e1,y1, p2.x-p2.w+e2,y2, p2.x-p2.w,y2, neon);
    poly(ectx, p1.x+p1.w,y1, p1.x+p1.w-e1,y1, p2.x+p2.w-e2,y2, p2.x+p2.w,y2, neon);
  }
  if(alt && n<110){
    poly(ectx, p1.x-p1.w-r1,y1, p1.x-p1.w,y1, p2.x-p2.w,y2, p2.x-p2.w-r2,y2, css(pal.rumble1,0.5));
    poly(ectx, p1.x+p1.w+r1,y1, p1.x+p1.w,y1, p2.x+p2.w,y2, p2.x+p2.w+r2,y2, css(pal.rumble1,0.5));
  }

  // faixas centrais
  if(alt){
    var l1=p1.w/48, l2=p2.w/48, lw1=p1.w*2/LANES, lw2=p2.w*2/LANES;
    var lx1=p1.x-p1.w+lw1, lx2=p2.x-p2.w+lw2;
    for(var l=1;l<LANES;l++){
      poly(sctx, lx1-l1,y1, lx1+l1,y1, lx2+l2,y2, lx2-l2,y2, Ccol.lane);
      lx1+=lw1; lx2+=lw2;
    }
  }
}

function drawTunnel(seg){
  var p1=seg.p1.screen, p2=seg.p2.screen;
  if(p1.y<=p2.y) return;
  var h1=p1.w*tunH, h2=p2.w*tunH;
  poly(sctx, p1.x-p1.w,p1.y, p1.x-p1.w,p1.y-h1, p2.x-p2.w,p2.y-h2, p2.x-p2.w,p2.y, Ccol.wall);
  poly(sctx, p1.x+p1.w,p1.y, p1.x+p1.w,p1.y-h1, p2.x+p2.w,p2.y-h2, p2.x+p2.w,p2.y, Ccol.wall);
  poly(sctx, p1.x-p1.w,p1.y-h1, p1.x+p1.w,p1.y-h1, p2.x+p2.w,p2.y-h2, p2.x-p2.w,p2.y-h2, Ccol.ceil);
  if(seg.index%3===0){
    var t1=p1.w*0.075, t2=p2.w*0.075, yA=p1.y-h1*0.86, yB=p2.y-h2*0.86;
    poly(sctx, p1.x-p1.w,yA, p1.x-p1.w,yA+t1, p2.x-p2.w,yB+t2, p2.x-p2.w,yB, Ccol.tneon);
    poly(ectx, p1.x-p1.w,yA, p1.x-p1.w,yA+t1, p2.x-p2.w,yB+t2, p2.x-p2.w,yB, Ccol.tneon);
    poly(sctx, p1.x+p1.w,yA, p1.x+p1.w,yA+t1, p2.x+p2.w,yB+t2, p2.x+p2.w,yB, Ccol.tneon);
    poly(ectx, p1.x+p1.w,yA, p1.x+p1.w,yA+t1, p2.x+p2.w,yB+t2, p2.x+p2.w,yB, Ccol.tneon);
    var c1=p1.w*0.16, c2=p2.w*0.16;
    poly(sctx, p1.x-c1,p1.y-h1, p1.x+c1,p1.y-h1, p2.x+c2,p2.y-h2, p2.x-c2,p2.y-h2, Ccol.tlight);
    poly(ectx, p1.x-c1,p1.y-h1, p1.x+c1,p1.y-h1, p2.x+c2,p2.y-h2, p2.x-c2,p2.y-h2, Ccol.tlight);
  }
}
function drawSprite(seg, spr, offset, clipY, alpha){
  var sc = seg.p1.screen.scale;
  var destW = sc*spr.worldW*W/2;
  if(destW < 1.2) return;
  var destH = destW*(spr.h/spr.w);
  var destX = seg.p1.screen.x + (sc*offset*ROADW*W/2) - destW*0.5;
  var destY = seg.p1.screen.y - destH;
  if(destX > W || destX+destW < 0) return;

  var clipH = (destY+destH) - clipY;
  if(clipH < 0) clipH = 0;
  if(clipH >= destH) return;
  var srcH = spr.h - spr.h*clipH/destH;

  sctx.globalAlpha = alpha;
  sctx.drawImage(spr.img, 0,0, spr.w, srcH, destX, destY, destW, destH-clipH);
  sctx.globalAlpha = 1;
  if(spr.glow){
    ectx.globalAlpha = alpha*0.9;
    ectx.drawImage(spr.glow, 0,0, spr.w, srcH, destX, destY, destW, destH-clipH);
    ectx.globalAlpha = 1;
  }
}

/* ---------- céu ---------- */
function renderSky(){
  var hy = (horizonY > H*0.12 && horizonY < H*0.94) ? horizonY : H*0.5;
  var g = sctx.createLinearGradient(0,0,0,hy);
  g.addColorStop(0,   css(pal.skyTop));
  g.addColorStop(0.45,css(pal.skyMid));
  g.addColorStop(0.82,css(pal.skyLow));
  g.addColorStop(1,   css(pal.horizon));
  sctx.fillStyle=g; sctx.fillRect(0,0,W,hy+2);
  sctx.fillStyle=css(pal.horizon); sctx.fillRect(0,hy-1,W,H-hy+1);

  // estrelas
  if(pal.star>0.02){
    for(var i=0;i<stars.length;i++){
      var st=stars[i];
      var tw=0.55+0.45*Math.sin(sunPulse*1.6+st.t);
      sctx.fillStyle='rgba(255,255,255,'+(pal.star*tw*0.85).toFixed(3)+')';
      sctx.fillRect(st.x*W, st.y*hy, st.s, st.s);
    }
  }

  // sol
  var sunX = W*(0.5 + sunOffset);
  var sunY = hy - H*0.055;
  var sunR = Math.min(W,H)*0.21;
  drawSun(sunR);
  sctx.drawImage(sunCv, sunX-sunR, sunY-sunR, sunR*2, sunR*2);
  sunSX=sunX; sunSY=sunY; sunSR=sunR;

  // raios de luz
  sctx.save();
  sctx.globalCompositeOperation='lighter';
  sctx.translate(sunX,sunY);
  for(var r=0;r<9;r++){
    var a = sunPulse*0.05 + r*(PI*2/9);
    var rg = sctx.createLinearGradient(0,0,Math.cos(a)*sunR*4,Math.sin(a)*sunR*4);
    rg.addColorStop(0, css(pal.sun1,0.045));
    rg.addColorStop(1, css(pal.sun1,0));
    sctx.fillStyle=rg;
    sctx.beginPath(); sctx.moveTo(0,0);
    sctx.lineTo(Math.cos(a-0.05)*sunR*4, Math.sin(a-0.05)*sunR*4);
    sctx.lineTo(Math.cos(a+0.05)*sunR*4, Math.sin(a+0.05)*sunR*4);
    sctx.closePath(); sctx.fill();
  }
  sctx.restore();

  // serras
  var layers=[{i:0,par:0.16,amp:0.13,base:0.02},{i:1,par:0.28,amp:0.17,base:0.012},{i:2,par:0.42,amp:0.21,base:0.004}];
  for(var li=0;li<3;li++){
    var L2=layers[li], pts=ridges[L2.i];
    var col = css(li===0?pal.mount3:(li===1?pal.mount2:pal.mount1));
    var off = (bgX*L2.par)%(W);
    sctx.fillStyle=col;
    for(var rep=-1;rep<=1;rep++){
      var ox = off + rep*W;
      sctx.beginPath();
      sctx.moveTo(ox, hy+2);
      for(var i2=0;i2<pts.length;i2++)
        sctx.lineTo(ox+pts[i2].x*W, hy - pts[i2].y*H*L2.amp - H*L2.base);
      sctx.lineTo(ox+W, hy+2);
      sctx.closePath(); sctx.fill();
    }
  }
  return hy;
}

function renderSkyGlow(){
  if(sunSR<=0 || horizonY<=1) return;
  ectx.save();
  ectx.beginPath(); ectx.rect(0,0,W,horizonY); ectx.clip();
  ectx.globalAlpha=0.5;
  ectx.drawImage(sunCv, sunSX-sunSR, sunSY-sunSR, sunSR*2, sunSR*2);
  ectx.restore();
  ectx.globalAlpha=1;
}

var sunFrame=0;
function drawSun(R){
  sunFrame++;
  if(sunFrame%2!==1 && sunCv.width===Math.ceil(R*2)) return;
  var size=Math.max(80,Math.ceil(R*2));
  if(sunCv.width!==size){ sunCv.width=size; sunCv.height=size; }
  var g=sunCv.getContext('2d');
  g.clearRect(0,0,size,size);
  g.save();
  g.beginPath(); g.arc(size/2,size/2,size/2-2,0,PI*2); g.clip();
  var lg=g.createLinearGradient(0,0,0,size);
  lg.addColorStop(0,   css(mixRgb(pal.sun1,pal.sun2,0.18)));
  lg.addColorStop(0.42,css(mixRgb(pal.sun1,pal.sun2,0.55)));
  lg.addColorStop(1,   css(pal.sun2));
  g.fillStyle=lg; g.fillRect(0,0,size,size);
  g.restore();
  // faixas horizontais
  g.globalCompositeOperation='destination-out';
  var bands=11, phase=(sunPulse*7)%14;
  for(var b=0;b<bands;b++){
    var y = size*0.46 + b*(size*0.052) + phase*0.6;
    var th = size*0.006 + b*size*0.0038;
    if(y>size) continue;
    g.fillStyle='#000'; g.fillRect(0,y,size,th);
  }
  g.globalCompositeOperation='source-over';
}

/* ---------- carro do jogador ---------- */
/* onde a pista encostada no carro cai na tela, dada a geometria da câmera.
   O teto evita que o contato escape pela borda de baixo com FOV largo. */
function groundScreenY(){
  // mesma conta do project(): base do horizonte + sc*camera.y*H/2
  var sc = cameraDepth/Math.max(playerZ(),1);
  return Math.min(H*0.995, H*(0.5-camPitch) + sc*camHeight*H*0.5);
}
function renderPlayer(){
  var na=SPR.playerAngles.length;
  var spr=SPR.playerAngles[clamp(Math.round((clamp(visYaw,-1,1)+1)/2*(na-1)),0,na-1)];
  var sc = cameraDepth/playerZ();
  var destW = sc*spr.worldW*W/2;
  var destH = destW*(spr.h/spr.w);
  var bob = Math.sin(sunPulse*13)*destH*0.006*(speed/maxSpeed);
  var destX = W/2 - destW/2 + (playerX*0.06*destW);
  var destY = groundScreenY() - destH + bob;
  var tilt = driftAngle*0.34;

  // chamas do nitro
  if(boosting>0.05){
    sctx.save(); ectx.save();
    var fx=[destX+destW*0.415, destX+destW*0.585], fy=destY+destH*0.872;
    for(var f=0;f<2;f++){
      var len=destH*(0.10+boosting*0.30)*rand(0.75,1.2);
      var g1=sctx.createLinearGradient(fx[f],fy,fx[f],fy+len);
      g1.addColorStop(0,'rgba(255,255,255,0.95)');
      g1.addColorStop(0.35,'rgba(120,220,255,0.75)');
      g1.addColorStop(1,'rgba(255,47,135,0)');
      sctx.fillStyle=g1; ectx.fillStyle=g1;
      sctx.beginPath(); sctx.ellipse(fx[f],fy+len*0.45,destW*0.030,len*0.55,0,0,PI*2); sctx.fill();
      ectx.beginPath(); ectx.ellipse(fx[f],fy+len*0.45,destW*0.030,len*0.55,0,0,PI*2); ectx.fill();
    }
    sctx.restore(); ectx.restore();
  }

  sctx.save();
  sctx.translate(destX+destW/2, destY+destH*0.72);
  sctx.rotate(tilt);
  sctx.drawImage(spr.img, -destW/2, -destH*0.72, destW, destH);
  sctx.restore();

  ectx.save();
  ectx.translate(destX+destW/2, destY+destH*0.72);
  ectx.rotate(tilt);
  ectx.globalAlpha = 0.9;
  ectx.drawImage(spr.glow, -destW/2, -destH*0.72, destW, destH);
  if(ctrl.brake){
    ectx.globalAlpha=1;
    ectx.drawImage(spr.glow, -destW/2, -destH*0.72, destW, destH);
    ectx.drawImage(spr.glow, -destW/2, -destH*0.72, destW, destH);
  }
  ectx.globalAlpha=1;
  ectx.restore();

  if(ctrl.brake){
    sctx.save();
    sctx.translate(destX+destW/2, destY+destH*0.72); sctx.rotate(tilt);
    sctx.drawImage(spr.glow, -destW/2, -destH*0.72, destW, destH);
    sctx.restore();
  }
}

/* ---------- cabine (câmera interna) ---------- */
function wheelR(){ return Math.min(W*0.315, H*0.355); }
function wheelCY(){ return H*1.00; }

/* volante pré-renderizado: aro de fundo chato perfurado, raios em carbono,
   cubo com emblema e borboletas de troca */
function buildWheel(){
  var R=wheelR(), S=Math.ceil(R*2.5), c=cv(S,S), g=c.getContext('2d');
  var eC=cv(S,S), e=eC.getContext('2d');
  var cx=S/2, cy=S/2, th=R*0.150, i, j, a, r2;
  var A0=PI*0.70, A1=PI*0.30;                 // corte do fundo chato
  var bx=cx+Math.cos(A0)*R, by=cy+Math.sin(A0)*R;

  function rimPath(gg,r){
    gg.beginPath();
    gg.arc(cx,cy,r,A0,A1,false);
    gg.lineTo(cx+Math.cos(A0)*r, cy+Math.sin(A0)*r);
  }

  // sombra externa do aro
  g.save();
  g.strokeStyle='rgba(0,0,0,0.55)'; g.lineWidth=th*1.34; g.lineJoin='round'; g.lineCap='round';
  rimPath(g,R); g.stroke();
  g.restore();

  // aro: couro com volume (escuro embaixo, realce em cima)
  var rg=g.createLinearGradient(0,cy-R,0,cy+R);
  rg.addColorStop(0,'#3a2d55'); rg.addColorStop(0.30,'#241a3c');
  rg.addColorStop(0.62,'#150e28'); rg.addColorStop(1,'#0c0818');
  g.strokeStyle=rg; g.lineWidth=th; g.lineJoin='round'; g.lineCap='round';
  rimPath(g,R); g.stroke();

  // brilho especular no topo do aro
  g.save();
  g.strokeStyle='rgba(198,176,255,0.30)'; g.lineWidth=th*0.26; g.lineCap='round';
  g.beginPath(); g.arc(cx,cy,R-th*0.30,PI*1.20,PI*1.80,false); g.stroke();
  g.strokeStyle='rgba(255,255,255,0.13)'; g.lineWidth=th*0.12;
  g.beginPath(); g.arc(cx,cy,R-th*0.33,PI*1.28,PI*1.72,false); g.stroke();
  g.restore();

  // couro perfurado nas zonas de pega (9h e 3h)
  var zones=[[PI*0.84,PI*1.18],[PI*1.82,PI*2.16]];
  for(i=0;i<2;i++){
    var za=zones[i][0], zb=zones[i][1];
    for(j=0;j<=26;j++){
      a = za+(zb-za)*(j/26);
      for(r2=0;r2<2;r2++){
        var pr = R + (r2? th*0.20 : -th*0.20);
        var px = cx+Math.cos(a)*pr, py = cy+Math.sin(a)*pr;
        g.fillStyle='rgba(4,2,10,0.62)';
        g.beginPath(); g.arc(px,py,Math.max(0.7,R*0.0090),0,PI*2); g.fill();
        g.fillStyle='rgba(190,170,240,0.10)';
        g.beginPath(); g.arc(px-R*0.003,py-R*0.003,Math.max(0.5,R*0.0045),0,PI*2); g.fill();
      }
    }
  }

  // apoios de polegar em 10 e 2 horas
  for(i=0;i<2;i++){
    a = i? PI*1.72 : PI*1.28;
    g.save(); g.translate(cx+Math.cos(a)*R, cy+Math.sin(a)*R); g.rotate(a+PI/2);
    var tg=g.createLinearGradient(0,-th*0.9,0,th*0.9);
    tg.addColorStop(0,'#4a3a6e'); tg.addColorStop(0.5,'#2b1f49'); tg.addColorStop(1,'#150e28');
    g.fillStyle=tg; rr(g,-th*0.62,-R*0.155,th*1.24,R*0.31,th*0.44); g.fill();
    g.strokeStyle='rgba(255,110,190,0.20)'; g.lineWidth=Math.max(1,R*0.006);
    rr(g,-th*0.62,-R*0.155,th*1.24,R*0.31,th*0.44); g.stroke();
    g.restore();
  }

  // costura vermelha ao longo do aro
  g.strokeStyle='rgba(255,90,150,0.42)'; g.lineWidth=Math.max(1,R*0.0085);
  for(i=0;i<64;i++){
    a = A0 + (2*PI-(A0-A1))*(i/63);
    var cs=Math.cos(a), sn=Math.sin(a);
    g.beginPath();
    g.moveTo(cx+cs*(R-th*0.16), cy+sn*(R-th*0.16));
    g.lineTo(cx+cs*(R+th*0.16), cy+sn*(R+th*0.16));
    g.stroke();
  }
  // costura no trecho reto de baixo
  g.beginPath(); g.moveTo(bx,by); g.lineTo(cx+Math.cos(A1)*R, cy+Math.sin(A1)*R);
  g.setLineDash([R*0.028,R*0.030]); g.strokeStyle='rgba(255,90,150,0.34)';
  g.lineWidth=Math.max(1,R*0.010); g.stroke(); g.setLineDash([]);

  // marca de centro em 12h (referência de esterço)
  for(r2=0;r2<2;r2++){
    var gm = r2? e : g;
    gm.strokeStyle = r2? 'rgba(255,240,255,0.85)' : 'rgba(255,240,255,0.70)';
    gm.lineWidth = th*0.34; gm.lineCap='butt';
    gm.beginPath(); gm.arc(cx,cy,R,PI*1.478,PI*1.522,false); gm.stroke();
  }

  // raios (9h, 3h, 6h) em carbono
  var spk=[PI, 0, PI*0.5];
  for(i=0;i<3;i++){
    a=spk[i];
    var len = (i===2) ? R*0.80 : R*0.92;
    g.save(); g.translate(cx,cy); g.rotate(a);
    var sg=g.createLinearGradient(0,-R*0.10,0,R*0.10);
    sg.addColorStop(0,'#39304f'); sg.addColorStop(0.35,'#221a38');
    sg.addColorStop(0.70,'#171029'); sg.addColorStop(1,'#0d0918');
    g.fillStyle=sg;
    g.beginPath();
    g.moveTo(R*0.12,-R*0.115); g.lineTo(len,-R*0.062);
    g.lineTo(len, R*0.062);    g.lineTo(R*0.12, R*0.115);
    g.closePath();
    g.save(); g.clip();
    g.fill();
    // trama de fibra de carbono
    g.strokeStyle='rgba(120,105,165,0.11)'; g.lineWidth=Math.max(0.6,R*0.0035);
    for(j=-14;j<40;j++){
      g.beginPath(); g.moveTo(R*0.10+j*R*0.026,-R*0.13); g.lineTo(R*0.10+j*R*0.026+R*0.26,R*0.13); g.stroke();
      g.beginPath(); g.moveTo(R*0.10+j*R*0.026, R*0.13); g.lineTo(R*0.10+j*R*0.026+R*0.26,-R*0.13); g.stroke();
    }
    g.restore();
    g.strokeStyle='rgba(160,140,220,0.16)'; g.lineWidth=Math.max(1,R*0.005); g.stroke();
    // rasgo aliviado no meio do raio
    if(i!==2){
      g.fillStyle='rgba(6,3,14,0.85)';
      rr(g,R*0.34,-R*0.030,len-R*0.52,R*0.060,R*0.028); g.fill();
      g.strokeStyle='rgba(0,229,255,0.10)'; g.lineWidth=Math.max(1,R*0.004);
      rr(g,R*0.34,-R*0.030,len-R*0.52,R*0.060,R*0.028); g.stroke();
    }
    g.restore();
  }

  // botões nos raios laterais
  var btn=[[-1,-1],[-1,1],[1,-1],[1,1]];
  for(i=0;i<4;i++){
    var bxp=cx+btn[i][0]*R*0.50, byp=cy+btn[i][1]*R*0.052;
    g.fillStyle='#0a0716'; rr(g,bxp-R*0.052,byp-R*0.030,R*0.104,R*0.060,R*0.018); g.fill();
    g.fillStyle='#2a2048'; rr(g,bxp-R*0.045,byp-R*0.024,R*0.090,R*0.048,R*0.015); g.fill();
    g.fillStyle=(i%2)?'rgba(0,229,255,0.55)':'rgba(255,110,190,0.55)';
    g.beginPath(); g.arc(bxp,byp,R*0.013,0,PI*2); g.fill();
  }

  // cubo central
  var hr=R*0.215;
  g.fillStyle='rgba(0,0,0,0.5)'; g.beginPath(); g.arc(cx,cy+R*0.012,hr*1.06,0,PI*2); g.fill();
  // anel cromado do cubo
  var cr=g.createLinearGradient(cx-hr,cy-hr,cx+hr,cy+hr);
  cr.addColorStop(0,'#6a5a92'); cr.addColorStop(0.35,'#2b2048');
  cr.addColorStop(0.62,'#8878b8'); cr.addColorStop(1,'#231a3c');
  g.strokeStyle=cr; g.lineWidth=Math.max(1.5,R*0.020);
  g.beginPath(); g.arc(cx,cy,hr*1.02,0,PI*2); g.stroke();
  var hg=g.createRadialGradient(cx-hr*0.34,cy-hr*0.44,hr*0.10,cx,cy,hr);
  hg.addColorStop(0,'#332651'); hg.addColorStop(0.55,'#181030'); hg.addColorStop(1,'#0a0616');
  g.fillStyle=hg; g.beginPath(); g.arc(cx,cy,hr,0,PI*2); g.fill();
  g.strokeStyle='rgba(255,110,190,0.34)'; g.lineWidth=Math.max(1,R*0.008);
  g.beginPath(); g.arc(cx,cy,hr*0.93,0,PI*2); g.stroke();
  e.strokeStyle='rgba(255,110,190,0.55)'; e.lineWidth=Math.max(1,R*0.008);
  e.beginPath(); e.arc(cx,cy,hr*0.93,0,PI*2); e.stroke();

  // emblema: raio estilizado
  for(r2=0;r2<2;r2++){
    var gg2 = r2? e : g;
    gg2.fillStyle = r2? '#9df9ff' : '#cfefff';
    gg2.save(); gg2.translate(cx,cy);
    gg2.beginPath();
    gg2.moveTo( hr*0.10,-hr*0.52); gg2.lineTo(-hr*0.34, hr*0.06);
    gg2.lineTo(-hr*0.05, hr*0.06); gg2.lineTo(-hr*0.20, hr*0.54);
    gg2.lineTo( hr*0.34,-hr*0.04); gg2.lineTo( hr*0.02,-hr*0.04);
    gg2.closePath(); gg2.fill();
    gg2.restore();
  }

  // borboletas de troca atrás do aro
  for(i=0;i<2;i++){
    var sgn = i?1:-1;
    g.save(); g.translate(cx+sgn*R*0.70, cy-R*0.16); g.rotate(sgn*0.20);
    var pgd=g.createLinearGradient(0,-R*0.20,0,R*0.20);
    pgd.addColorStop(0,'#4b3a70'); pgd.addColorStop(1,'#150e28');
    g.fillStyle=pgd; rr(g,-R*0.045,-R*0.20,R*0.090,R*0.40,R*0.030); g.fill();
    g.strokeStyle='rgba(0,229,255,0.30)'; g.lineWidth=Math.max(1,R*0.006);
    rr(g,-R*0.045,-R*0.20,R*0.090,R*0.40,R*0.030); g.stroke();
    g.fillStyle='rgba(0,229,255,0.16)';
    g.font='900 '+Math.max(6,(R*0.048)|0)+'px "Arial Black",Arial,sans-serif';
    g.textAlign='center'; g.textBaseline='middle';
    g.fillText(sgn>0?'+':'-',0,-R*0.10);
    g.restore();
  }

  return {img:c, glow:eC, size:S, R:R};
}

/* mostrador analógico estático (aro, marcações, números) */
function gaugeFace(g,e,cx,cy,r,maxN,step,redFrom,label){
  var A0=PI*0.75, SW=PI*1.5, i, a, t, n;
  // poço do mostrador
  var bgg=g.createRadialGradient(cx,cy-r*0.30,r*0.10,cx,cy,r*1.05);
  bgg.addColorStop(0,'#191131'); bgg.addColorStop(0.62,'#0e0920'); bgg.addColorStop(1,'#05030d');
  g.fillStyle=bgg; g.beginPath(); g.arc(cx,cy,r,0,PI*2); g.fill();
  // bisel duplo com realce metálico
  var bez=g.createLinearGradient(cx-r,cy-r,cx+r,cy+r);
  bez.addColorStop(0,'rgba(180,160,235,0.42)'); bez.addColorStop(0.45,'rgba(90,76,140,0.22)');
  bez.addColorStop(0.70,'rgba(200,182,255,0.34)'); bez.addColorStop(1,'rgba(60,50,100,0.20)');
  g.strokeStyle=bez; g.lineWidth=Math.max(1.5,r*0.062);
  g.beginPath(); g.arc(cx,cy,r*0.982,0,PI*2); g.stroke();
  g.strokeStyle='rgba(255,255,255,0.10)'; g.lineWidth=Math.max(1,r*0.016);
  g.beginPath(); g.arc(cx,cy,r*0.938,PI*1.10,PI*1.90); g.stroke();
  // textura de guilhoché no fundo
  g.save();
  g.beginPath(); g.arc(cx,cy,r*0.90,0,PI*2); g.clip();
  g.strokeStyle='rgba(150,130,205,0.055)'; g.lineWidth=Math.max(0.6,r*0.006);
  for(i=0;i<30;i++){
    a=PI*2*(i/30);
    g.beginPath(); g.moveTo(cx,cy); g.lineTo(cx+Math.cos(a)*r, cy+Math.sin(a)*r); g.stroke();
  }
  for(i=1;i<=4;i++){
    g.beginPath(); g.arc(cx,cy,r*0.18*i,0,PI*2); g.stroke();
  }
  g.restore();

  // faixa vermelha
  if(redFrom!==null){
    var ra=A0+SW*redFrom;
    g.strokeStyle='rgba(255,45,90,0.80)'; g.lineWidth=r*0.062;
    g.beginPath(); g.arc(cx,cy,r*0.845,ra,A0+SW,false); g.stroke();
    e.strokeStyle='rgba(255,45,90,0.75)'; e.lineWidth=r*0.062;
    e.beginPath(); e.arc(cx,cy,r*0.845,ra,A0+SW,false); e.stroke();
  }
  // marcações
  for(i=0;i<=maxN*step;i++){
    t=i/(maxN*step); a=A0+SW*t;
    var maj=(i%step===0);
    var r1=r*(maj?0.70:0.78), r0=r*0.885;
    g.strokeStyle = maj ? 'rgba(255,236,255,0.88)' : 'rgba(190,170,235,0.42)';
    g.lineWidth = maj ? Math.max(1.6,r*0.036) : Math.max(1,r*0.016);
    g.beginPath();
    g.moveTo(cx+Math.cos(a)*r0, cy+Math.sin(a)*r0);
    g.lineTo(cx+Math.cos(a)*r1, cy+Math.sin(a)*r1);
    g.stroke();
    if(maj){
      n=i/step;
      g.font='900 '+Math.max(7,(r*0.20)|0)+'px "Arial Black",Arial,sans-serif';
      g.textAlign='center'; g.textBaseline='middle';
      g.fillStyle = (redFrom!==null && t>=redFrom) ? '#ff6b8a' : 'rgba(238,228,255,0.90)';
      g.fillText(String(n), cx+Math.cos(a)*r*0.575, cy+Math.sin(a)*r*0.575);
    }
  }
  if(label){
    g.font='900 '+Math.max(6,(r*0.135)|0)+'px "Arial Black",Arial,sans-serif';
    g.textAlign='center'; g.textBaseline='middle';
    g.fillStyle='rgba(0,229,255,0.55)';
    g.fillText(label, cx, cy+r*0.50);
  }
  // reflexo de vidro
  g.save();
  g.beginPath(); g.arc(cx,cy,r*0.94,0,PI*2); g.clip();
  var gl=g.createLinearGradient(cx-r*0.7,cy-r*0.9,cx+r*0.2,cy+r*0.2);
  gl.addColorStop(0,'rgba(226,238,255,0.10)'); gl.addColorStop(1,'rgba(226,238,255,0)');
  g.fillStyle=gl; g.fillRect(cx-r,cy-r,r*2,r*2);
  g.restore();
}

/* barra vertical segmentada (temperatura, energia) — moldura estática */
function barFrame(g,x,y,w,h,label){
  var i;
  g.fillStyle='rgba(5,3,12,0.90)'; rr(g,x,y,w,h,w*0.30); g.fill();
  g.strokeStyle='rgba(150,130,205,0.24)'; g.lineWidth=Math.max(1,w*0.075);
  rr(g,x,y,w,h,w*0.30); g.stroke();
  for(i=0;i<9;i++){
    var yy=y+h*(0.10+i*0.0975);
    g.strokeStyle = i<2 ? 'rgba(255,70,110,0.55)' : 'rgba(190,172,235,0.28)';
    g.lineWidth=Math.max(1,h*0.008);
    g.beginPath(); g.moveTo(x-w*0.30,yy); g.lineTo(x-w*0.05,yy); g.stroke();
  }
  g.font='900 '+Math.max(6,(w*0.62)|0)+'px "Arial Black",Arial,sans-serif';
  g.textAlign='center'; g.textBaseline='middle';
  g.fillStyle='rgba(0,229,255,0.55)';
  g.fillText(label, x+w*0.5, y+h+w*0.85);
}

/* grade de alto-falante em pontos */
function speakerGrille(g,cx,cy,rad){
  var ring, k, n, a, d;
  g.fillStyle='rgba(3,2,8,0.75)';
  g.beginPath(); g.arc(cx,cy,rad,0,PI*2); g.fill();
  g.strokeStyle='rgba(150,130,205,0.20)'; g.lineWidth=Math.max(1,rad*0.045);
  g.beginPath(); g.arc(cx,cy,rad*0.97,0,PI*2); g.stroke();
  for(ring=1;ring<=4;ring++){
    d = rad*0.20*ring; n = 6*ring;
    for(k=0;k<n;k++){
      a = PI*2*(k/n) + ring*0.22;
      g.fillStyle='rgba(140,124,190,0.16)';
      g.beginPath(); g.arc(cx+Math.cos(a)*d, cy+Math.sin(a)*d, Math.max(0.7,rad*0.036), 0, PI*2); g.fill();
    }
  }
}

function buildCockpit(){
  var c=cv(W,H), g=c.getContext('2d');
  var eC=cv(W,H), e=eC.getContext('2d');
  var hoodY=H*0.600, dashY=H*0.720, v, i, j;

  var R=wheelR();
  var binHalf=Math.min(R*1.00, W*0.305);
  var binL=W*0.5-binHalf, binR=W*0.5+binHalf;
  var binY=dashY+H*0.030, binH=H*0.245;

  /* ---- vidro: banda de tinta no topo e reflexos ---- */
  var tint=g.createLinearGradient(0,0,0,H*0.30);
  tint.addColorStop(0,'rgba(24,6,44,0.80)'); tint.addColorStop(0.55,'rgba(24,6,44,0.22)');
  tint.addColorStop(1,'rgba(24,6,44,0)');
  g.fillStyle=tint; g.fillRect(0,0,W,H*0.30);

  g.save(); g.globalAlpha=0.055; g.fillStyle='#dcefff';
  g.beginPath(); g.moveTo(W*0.10,0); g.lineTo(W*0.30,0); g.lineTo(W*0.02,H*0.62); g.lineTo(-W*0.10,H*0.62); g.closePath(); g.fill();
  g.globalAlpha=0.030;
  g.beginPath(); g.moveTo(W*0.42,0); g.lineTo(W*0.50,0); g.lineTo(W*0.24,H*0.62); g.lineTo(W*0.16,H*0.62); g.closePath(); g.fill();
  g.restore();

  // marcas finas de limpador no vidro
  g.save(); g.globalAlpha=0.030; g.strokeStyle='#cfe4ff';
  g.lineWidth=Math.max(1,H*0.0022);
  for(i=0;i<5;i++){
    g.beginPath();
    g.arc(W*0.34, H*0.86, H*(0.30+i*0.052), PI*1.16, PI*1.72);
    g.stroke();
  }
  g.restore();

  /* ---- capô ---- */
  var hg=g.createLinearGradient(0,hoodY,0,H*0.80);
  hg.addColorStop(0,'#8d1252'); hg.addColorStop(0.34,'#5c0833');
  hg.addColorStop(0.72,'#31051c'); hg.addColorStop(1,'#1a0310');
  g.fillStyle=hg;
  g.beginPath(); g.moveTo(-W*0.05,H*0.90); g.lineTo(W*0.05,hoodY+H*0.052);
  g.quadraticCurveTo(W*0.5,hoodY-H*0.030,W*0.95,hoodY+H*0.052);
  g.lineTo(W*1.05,H*0.90); g.closePath(); g.fill();

  // reflexo do céu na pintura
  g.save();
  g.beginPath(); g.moveTo(-W*0.05,H*0.90); g.lineTo(W*0.05,hoodY+H*0.052);
  g.quadraticCurveTo(W*0.5,hoodY-H*0.030,W*0.95,hoodY+H*0.052);
  g.lineTo(W*1.05,H*0.90); g.closePath(); g.clip();
  var refl=g.createLinearGradient(0,hoodY,0,hoodY+H*0.075);
  refl.addColorStop(0,'rgba(255,190,235,0.30)'); refl.addColorStop(1,'rgba(255,190,235,0)');
  g.fillStyle=refl; g.fillRect(0,hoodY-H*0.02,W,H*0.12);
  // frisos de painel do capô
  g.strokeStyle='rgba(10,2,8,0.45)'; g.lineWidth=Math.max(1,W*0.0020);
  for(i=0;i<2;i++){
    var lx=i?W*0.735:W*0.265;
    g.beginPath(); g.moveTo(lx,hoodY); g.lineTo(lx+(i?1:-1)*W*0.055,H*0.92); g.stroke();
  }
  g.restore();

  // aresta neon do capô
  for(v=0;v<2;v++){
    var gg=v?e:g;
    gg.strokeStyle = v?'rgba(255,190,235,0.85)':'rgba(255,190,235,0.50)';
    gg.lineWidth=Math.max(2,W*0.0030);
    gg.beginPath(); gg.moveTo(W*0.05,hoodY+H*0.052);
    gg.quadraticCurveTo(W*0.5,hoodY-H*0.030,W*0.95,hoodY+H*0.052); gg.stroke();
  }
  // vinco central
  g.strokeStyle='rgba(255,175,222,0.16)'; g.lineWidth=Math.max(1,W*0.0022);
  g.beginPath(); g.moveTo(W*0.5,hoodY-H*0.014); g.lineTo(W*0.5,H*0.90); g.stroke();

  // entradas de ar com aletas
  for(i=0;i<2;i++){
    var vx=i?W*0.575:W*0.285, vy=hoodY+H*0.040, vw=W*0.140, vh=H*0.036;
    g.fillStyle='rgba(6,2,12,0.80)'; rr(g,vx,vy,vw,vh,H*0.010); g.fill();
    g.strokeStyle='rgba(255,175,222,0.22)'; g.lineWidth=Math.max(1,W*0.0018);
    rr(g,vx,vy,vw,vh,H*0.010); g.stroke();
    g.fillStyle='rgba(120,60,110,0.35)';
    for(v=0;v<4;v++) g.fillRect(vx+vw*0.10, vy+vh*(0.20+v*0.185), vw*0.80, vh*0.075);
  }

  /* ---- braços do limpador repousados na base do vidro ---- */
  for(i=0;i<2;i++){
    var wax=i?W*0.62:W*0.18, way=hoodY+H*0.044;
    g.save(); g.translate(wax,way); g.rotate(i?-0.10:-0.055);
    g.strokeStyle='rgba(8,4,16,0.80)'; g.lineWidth=Math.max(1.6,H*0.0055); g.lineCap='round';
    g.beginPath(); g.moveTo(0,0); g.lineTo(W*0.215,-H*0.014); g.stroke();
    g.strokeStyle='rgba(40,28,66,0.85)'; g.lineWidth=Math.max(1,H*0.0028);
    g.beginPath(); g.moveTo(W*0.020,-H*0.003); g.lineTo(W*0.205,-H*0.016); g.stroke();
    g.restore();
  }

  /* ---- painel ---- */
  var dg=g.createLinearGradient(0,dashY,0,H);
  dg.addColorStop(0,'#2e2150'); dg.addColorStop(0.18,'#180f2c');
  dg.addColorStop(0.55,'#0d0819'); dg.addColorStop(1,'#05030c');
  g.fillStyle=dg;
  g.beginPath(); g.moveTo(-W*0.05,H*1.02); g.lineTo(-W*0.05,dashY+H*0.030);
  g.quadraticCurveTo(W*0.5,dashY-H*0.052,W*1.05,dashY+H*0.030);
  g.lineTo(W*1.05,H*1.02); g.closePath(); g.fill();

  // grão de couro no painel
  g.save();
  g.beginPath(); g.moveTo(-W*0.05,H*1.02); g.lineTo(-W*0.05,dashY+H*0.030);
  g.quadraticCurveTo(W*0.5,dashY-H*0.052,W*1.05,dashY+H*0.030);
  g.lineTo(W*1.05,H*1.02); g.closePath(); g.clip();
  for(i=0;i<520;i++){
    var gx=Math.random()*W, gy=dashY-H*0.05+Math.random()*H*0.34;
    g.fillStyle='rgba(160,142,210,'+(0.020+Math.random()*0.030).toFixed(3)+')';
    g.fillRect(gx,gy,Math.max(1,W*0.0016),Math.max(1,W*0.0016));
  }
  g.restore();

  // costura e filete neon no topo do painel
  for(v=0;v<2;v++){
    var g2=v?e:g;
    g2.strokeStyle = v?'rgba(255,47,135,0.85)':'rgba(255,47,135,0.60)';
    g2.lineWidth=Math.max(2,W*0.0034);
    g2.beginPath(); g2.moveTo(-W*0.05,dashY+H*0.030);
    g2.quadraticCurveTo(W*0.5,dashY-H*0.052,W*1.05,dashY+H*0.030); g2.stroke();
  }
  g.setLineDash([W*0.010,W*0.011]);
  g.strokeStyle='rgba(255,150,200,0.30)'; g.lineWidth=Math.max(1,W*0.0016);
  g.beginPath(); g.moveTo(-W*0.05,dashY+H*0.046);
  g.quadraticCurveTo(W*0.5,dashY-H*0.036,W*1.05,dashY+H*0.046); g.stroke();
  // segunda carreira de costura
  g.strokeStyle='rgba(255,150,200,0.18)'; g.lineWidth=Math.max(1,W*0.0014);
  g.beginPath(); g.moveTo(-W*0.05,dashY+H*0.064);
  g.quadraticCurveTo(W*0.5,dashY-H*0.018,W*1.05,dashY+H*0.064); g.stroke();
  g.setLineDash([]);

  // difusores de ar com moldura cromada
  for(i=0;i<2;i++){
    var ax=i?W*0.795:W*0.070, ay=dashY+H*0.070, aw=W*0.135, ah=H*0.042;
    g.fillStyle='rgba(2,1,6,0.80)'; rr(g,ax-W*0.006,ay-H*0.005,aw+W*0.012,ah+H*0.010,H*0.014); g.fill();
    var cg=g.createLinearGradient(ax,ay,ax+aw,ay+ah);
    cg.addColorStop(0,'rgba(170,150,220,0.34)'); cg.addColorStop(0.5,'rgba(70,58,110,0.18)');
    cg.addColorStop(1,'rgba(190,172,240,0.28)');
    g.strokeStyle=cg; g.lineWidth=Math.max(1,W*0.0026);
    rr(g,ax-W*0.006,ay-H*0.005,aw+W*0.012,ah+H*0.010,H*0.014); g.stroke();
    g.fillStyle='#0a0716'; rr(g,ax,ay,aw,ah,H*0.011); g.fill();
    g.fillStyle='#221838';
    for(v=0;v<5;v++) g.fillRect(ax+aw*0.06, ay+ah*(0.14+v*0.160), aw*0.88, ah*0.072);
    g.fillStyle='rgba(0,229,255,0.20)';
    g.fillRect(ax+aw*0.06, ay+ah*0.14, aw*0.88, ah*0.020);
    // rodinha de ajuste
    g.fillStyle='#2b2048';
    rr(g,ax+aw*0.40,ay+ah*1.05,aw*0.20,ah*0.16,ah*0.07); g.fill();
  }

  /* ---- montantes A ---- */
  var pg=g.createLinearGradient(0,0,W*0.20,H);
  pg.addColorStop(0,'#171029'); pg.addColorStop(1,'#07040e');
  g.fillStyle=pg;
  g.beginPath(); g.moveTo(0,0); g.lineTo(W*0.090,0); g.lineTo(W*0.200,H); g.lineTo(0,H); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(W,0); g.lineTo(W*0.910,0); g.lineTo(W*0.800,H); g.lineTo(W,H); g.closePath(); g.fill();
  // debrum costurado nos montantes
  for(i=0;i<2;i++){
    var x0=i?W*0.910:W*0.090, x1=i?W*0.800:W*0.200;
    g.strokeStyle='rgba(255,110,190,0.26)'; g.lineWidth=Math.max(1,W*0.0022);
    g.beginPath(); g.moveTo(x0,0); g.lineTo(x1,H); g.stroke();
    g.setLineDash([H*0.016,H*0.018]);
    g.strokeStyle='rgba(255,150,200,0.20)'; g.lineWidth=Math.max(1,W*0.0014);
    g.beginPath(); g.moveTo(x0-(i?-1:1)*W*0.016,0); g.lineTo(x1-(i?-1:1)*W*0.016,H); g.stroke();
    g.setLineDash([]);
  }
  // tweeters na base dos montantes
  speakerGrille(g, W*0.055, H*0.400, Math.min(W*0.026,H*0.030));
  speakerGrille(g, W*0.945, H*0.400, Math.min(W*0.026,H*0.030));

  /* ---- teto, quebra-sol, luz de cortesia e retrovisor ---- */
  g.fillStyle='#08050f'; g.fillRect(0,0,W,H*0.044);
  // quebra-sóis
  for(i=0;i<2;i++){
    var svx=i?W*0.560:W*0.062, svw=W*0.378;
    var svg=g.createLinearGradient(0,H*0.030,0,H*0.086);
    svg.addColorStop(0,'#140e26'); svg.addColorStop(1,'#0a0618');
    g.fillStyle=svg; rr(g,svx,H*0.030,svw,H*0.054,H*0.010); g.fill();
    g.strokeStyle='rgba(150,130,205,0.16)'; g.lineWidth=Math.max(1,W*0.0016);
    rr(g,svx,H*0.030,svw,H*0.054,H*0.010); g.stroke();
    g.setLineDash([W*0.008,W*0.009]);
    g.strokeStyle='rgba(255,150,200,0.14)'; g.lineWidth=Math.max(1,W*0.0012);
    g.beginPath(); g.moveTo(svx+W*0.010,H*0.076); g.lineTo(svx+svw-W*0.010,H*0.076); g.stroke();
    g.setLineDash([]);
  }
  // luz de cortesia
  g.fillStyle='#0d0a1a';
  g.beginPath(); g.moveTo(W*0.46,H*0.044); g.lineTo(W*0.54,H*0.044);
  g.lineTo(W*0.535,H*0.060); g.lineTo(W*0.465,H*0.060); g.closePath(); g.fill();
  g.fillStyle='rgba(190,175,240,0.10)';
  rr(g,W*0.478,H*0.046,W*0.044,H*0.010,H*0.004); g.fill();
  // corpo do retrovisor
  g.fillStyle='#0e0a1c'; rr(g,W*0.370,H*0.056,W*0.260,H*0.056,H*0.016); g.fill();
  g.strokeStyle='rgba(150,130,205,0.22)'; g.lineWidth=Math.max(1,W*0.0018);
  rr(g,W*0.370,H*0.056,W*0.260,H*0.056,H*0.016); g.stroke();
  var mg=g.createLinearGradient(0,H*0.062,0,H*0.106);
  mg.addColorStop(0,'#241a42'); mg.addColorStop(0.5,'#120c24'); mg.addColorStop(1,'#0a0618');
  g.fillStyle=mg; rr(g,W*0.379,H*0.063,W*0.242,H*0.042,H*0.010); g.fill();
  // câmera de bordo colada ao vidro
  g.fillStyle='#0a0716'; rr(g,W*0.640,H*0.062,W*0.042,H*0.026,H*0.007); g.fill();
  g.fillStyle='#1b1334'; g.beginPath(); g.arc(W*0.661,H*0.075,H*0.0072,0,PI*2); g.fill();
  g.fillStyle='rgba(0,229,255,0.30)'; g.beginPath(); g.arc(W*0.661,H*0.075,H*0.0030,0,PI*2); g.fill();
  // alça de apoio no montante direito
  g.save(); g.translate(W*0.878,H*0.150); g.rotate(0.16);
  g.strokeStyle='#1a1230'; g.lineWidth=Math.max(2,W*0.0090); g.lineCap='round';
  g.beginPath(); g.moveTo(0,0); g.lineTo(0,H*0.085); g.stroke();
  g.strokeStyle='rgba(150,130,205,0.18)'; g.lineWidth=Math.max(1,W*0.0030);
  g.beginPath(); g.moveTo(0,H*0.006); g.lineTo(0,H*0.079); g.stroke();
  g.restore();

  /* ---- porta do motorista (canto inferior esquerdo) ---- */
  var doorR = Math.max(W*0.10, binL-W*0.020);
  g.save();
  g.beginPath(); g.moveTo(0,H*0.760); g.lineTo(doorR,H*0.840); g.lineTo(doorR,H*1.02); g.lineTo(0,H*1.02); g.closePath();
  g.clip();
  var dgd=g.createLinearGradient(0,H*0.78,0,H);
  dgd.addColorStop(0,'#221739'); dgd.addColorStop(0.42,'#140d26'); dgd.addColorStop(1,'#07040f');
  g.fillStyle=dgd; g.fillRect(0,H*0.74,doorR,H*0.30);
  // fita de luz ambiente
  for(v=0;v<2;v++){
    var ga=v?e:g;
    ga.strokeStyle = v?'rgba(255,47,135,0.55)':'rgba(255,47,135,0.38)';
    ga.lineWidth=Math.max(1.5,H*0.0032);
    ga.beginPath(); ga.moveTo(0,H*0.800); ga.lineTo(doorR,H*0.878); ga.stroke();
  }
  // apoio de braço
  g.fillStyle='#1a1230';
  rr(g,doorR*0.10,H*0.898,doorR*0.86,H*0.040,H*0.012); g.fill();
  g.strokeStyle='rgba(150,130,205,0.18)'; g.lineWidth=Math.max(1,W*0.0016);
  rr(g,doorR*0.10,H*0.898,doorR*0.86,H*0.040,H*0.012); g.stroke();
  // botões de vidro elétrico
  for(i=0;i<2;i++){
    g.fillStyle='#0a0716';
    rr(g,doorR*(0.20+i*0.30),H*0.909,doorR*0.20,H*0.018,H*0.005); g.fill();
    g.fillStyle='rgba(0,229,255,0.22)';
    rr(g,doorR*(0.23+i*0.30),H*0.913,doorR*0.14,H*0.005,H*0.002); g.fill();
  }
  speakerGrille(g, doorR*0.52, H*0.968, Math.min(doorR*0.30, H*0.042));
  g.restore();

  /* ---- console à direita: tela e comandos ---- */
  var stackL=binR+W*0.014;
  var stackR=Math.min(W*0.980, stackL+W*0.285);
  var stackW=stackR-stackL;
  var hasStack = stackW > W*0.080;
  var scx=0, scy=0, scw=0, sch=0;
  if(hasStack){
    scx=stackL; scy=dashY+H*0.056; scw=stackW; sch=H*0.086;
    // moldura da tela
    g.fillStyle='#070411'; rr(g,scx-W*0.008,scy-H*0.008,scw+W*0.016,sch+H*0.016,H*0.014); g.fill();
    g.strokeStyle='rgba(0,229,255,0.26)'; g.lineWidth=Math.max(1,W*0.0018);
    rr(g,scx-W*0.008,scy-H*0.008,scw+W*0.016,sch+H*0.016,H*0.014); g.stroke();
    // vidro da tela
    var sgl=g.createLinearGradient(scx,scy,scx+scw,scy+sch);
    sgl.addColorStop(0,'#0b0a1e'); sgl.addColorStop(1,'#05040f');
    g.fillStyle=sgl; rr(g,scx,scy,scw,sch,H*0.008); g.fill();
    g.strokeStyle='rgba(255,255,255,0.05)'; g.lineWidth=Math.max(1,W*0.0012);
    g.beginPath(); g.moveTo(scx+scw*0.06,scy+H*0.004); g.lineTo(scx+scw*0.52,scy+H*0.004); g.stroke();
    // botões físicos sob a tela
    for(i=0;i<3;i++){
      g.fillStyle='#160f2b';
      rr(g, scx+scw*(0.06+i*0.33), scy+sch+H*0.016, scw*0.26, H*0.017, H*0.006); g.fill();
      g.strokeStyle='rgba(150,130,205,0.16)'; g.lineWidth=Math.max(1,W*0.0012);
      rr(g, scx+scw*(0.06+i*0.33), scy+sch+H*0.016, scw*0.26, H*0.017, H*0.006); g.stroke();
    }
    // botões giratórios de climatização
    for(i=0;i<2;i++){
      var kx=scx+scw*(0.26+i*0.48), ky=scy+sch+H*0.060, kr=Math.min(scw*0.15,H*0.026);
      g.fillStyle='rgba(2,1,6,0.80)'; g.beginPath(); g.arc(kx,ky,kr*1.16,0,PI*2); g.fill();
      var kg=g.createLinearGradient(kx-kr,ky-kr,kx+kr,ky+kr);
      kg.addColorStop(0,'#3a2c5e'); kg.addColorStop(0.55,'#1a1230'); kg.addColorStop(1,'#0b0718');
      g.fillStyle=kg; g.beginPath(); g.arc(kx,ky,kr,0,PI*2); g.fill();
      g.strokeStyle=i?'rgba(0,229,255,0.30)':'rgba(255,110,190,0.30)';
      g.lineWidth=Math.max(1,kr*0.10);
      g.beginPath(); g.arc(kx,ky,kr*0.86,PI*0.75,PI*1.85); g.stroke();
      g.strokeStyle='rgba(230,220,255,0.45)'; g.lineWidth=Math.max(1,kr*0.09);
      g.beginPath(); g.moveTo(kx,ky); g.lineTo(kx+Math.cos(PI*1.30)*kr*0.66, ky+Math.sin(PI*1.30)*kr*0.66); g.stroke();
    }
  }

  /* ---- capela do instrumento ---- */
  g.fillStyle='rgba(4,2,10,0.94)';
  g.beginPath();
  g.moveTo(binL,binY+binH); g.lineTo(binL+W*0.010,binY+H*0.024);
  g.quadraticCurveTo(W*0.5,binY-H*0.038,binR-W*0.010,binY+H*0.024);
  g.lineTo(binR,binY+binH); g.closePath(); g.fill();
  // pestana com sombra interna
  g.strokeStyle='rgba(150,130,205,0.22)'; g.lineWidth=Math.max(1,W*0.0022);
  g.beginPath(); g.moveTo(binL+W*0.010,binY+H*0.024);
  g.quadraticCurveTo(W*0.5,binY-H*0.038,binR-W*0.010,binY+H*0.024); g.stroke();
  var hood2=g.createLinearGradient(0,binY-H*0.030,0,binY+H*0.070);
  hood2.addColorStop(0,'rgba(0,0,0,0.72)'); hood2.addColorStop(1,'rgba(0,0,0,0)');
  g.save();
  g.beginPath();
  g.moveTo(binL,binY+binH); g.lineTo(binL+W*0.010,binY+H*0.024);
  g.quadraticCurveTo(W*0.5,binY-H*0.038,binR-W*0.010,binY+H*0.024);
  g.lineTo(binR,binY+binH); g.closePath(); g.clip();
  g.fillStyle=hood2; g.fillRect(binL,binY-H*0.04,binR-binL,H*0.12);
  g.restore();

  var gr=Math.min(binHalf*0.40, H*0.104);
  var tachoX=binL+binHalf*0.46, speedoX=binR-binHalf*0.46, gaugeY=binY+H*0.104;
  gaugeFace(g,e, tachoX,  gaugeY, gr, 8,2, 0.80, 'RPM x1000');
  gaugeFace(g,e, speedoX, gaugeY, gr, 6,2, 0.84, 'KM/H x60');

  // barras de temperatura e energia nas bordas da capela
  var bw=Math.max(3,binHalf*0.055), bh=H*0.105;
  var tempX=binL+binHalf*0.10, nrgX=binR-binHalf*0.10-bw, barY=binY+H*0.052;
  barFrame(g,tempX,barY,bw,bh,'TMP');
  barFrame(g,nrgX, barY,bw,bh,'NRG');

  return {img:c, glow:eC, hoodY:hoodY, dashY:dashY, binY:binY, binH:binH,
          binL:binL, binR:binR, binHalf:binHalf, gr:gr,
          tachoX:tachoX, speedoX:speedoX, gaugeY:gaugeY,
          tempX:tempX, nrgX:nrgX, barY:barY, barW:bw, barH:bh,
          hasStack:hasStack, scx:scx, scy:scy, scw:scw, sch:sch,
          doorR:doorR, wheel:buildWheel()};
}

function needle(g,cx,cy,len,ang,w,col){
  g.save(); g.translate(cx,cy); g.rotate(ang);
  g.fillStyle=col;
  g.beginPath();
  g.moveTo(-len*0.20,-w*0.55); g.lineTo(len,-w*0.18);
  g.lineTo(len, w*0.18);       g.lineTo(-len*0.20, w*0.55);
  g.closePath(); g.fill();
  g.restore();
}

/* preenchimento animado das barras verticais */
function drawBar(g,e,x,y,w,h,v,col,hot){
  var segs=9, i, on=Math.round(clamp(v,0,1)*segs);
  for(i=0;i<segs;i++){
    var sy=y+h-(i+1)*(h/segs)+h*0.010;
    var lit=i<on;
    g.fillStyle = lit ? (hot&&i>6?'#ff4466':col) : 'rgba(46,38,74,0.55)';
    rr(g,x+w*0.16,sy,w*0.68,h/segs-h*0.020,w*0.16); g.fill();
    if(lit){
      e.fillStyle = (hot&&i>6)?'#ff4466':col;
      rr(e,x+w*0.16,sy,w*0.68,h/segs-h*0.020,w*0.16); e.fill();
    }
  }
}

/* luva do piloto agarrando o aro; gira junto com o volante */
function drawGlove(g,e,cxw,cyw,R,ang,side,flex){
  var ha = ang + (side<0?PI:0);
  var hx = cxw+Math.cos(ha)*R, hy = cyw+Math.sin(ha)*R;
  var ax = cxw+side*R*0.98, ay = cyw+R*0.78;
  var j;

  /* ---- antebraço e manga ---- */
  var dx=hx-ax, dy=hy-ay, L=Math.sqrt(dx*dx+dy*dy)||1, fa=Math.atan2(dy,dx);
  g.save(); g.translate(ax,ay); g.rotate(fa);
  var sg=g.createLinearGradient(0,-R*0.16,0,R*0.16);
  sg.addColorStop(0,'#31264f'); sg.addColorStop(0.40,'#1a1230');
  sg.addColorStop(0.78,'#100a1f'); sg.addColorStop(1,'#080512');
  g.fillStyle=sg;
  g.beginPath();
  g.moveTo(0,-R*0.150); g.lineTo(L,-R*0.092);
  g.lineTo(L, R*0.092); g.lineTo(0, R*0.150);
  g.closePath(); g.fill();
  g.strokeStyle='rgba(0,0,0,0.50)'; g.lineWidth=Math.max(1,R*0.006);
  g.beginPath(); g.moveTo(0,R*0.150); g.lineTo(L,R*0.092); g.stroke();
  // faixa neon do macacão
  for(j=0;j<2;j++){
    var gp=j?e:g;
    gp.strokeStyle = j?'rgba(0,229,255,0.42)':'rgba(0,229,255,0.28)';
    gp.lineWidth=Math.max(1,R*0.010);
    gp.save(); gp.translate(ax,ay); gp.rotate(fa);
    gp.beginPath(); gp.moveTo(L*0.30,-R*0.115); gp.lineTo(L*0.94,-R*0.078); gp.stroke();
    gp.restore();
  }
  // punho da luva
  g.fillStyle='#241a3f';
  rr(g,L-R*0.185,-R*0.108,R*0.150,R*0.216,R*0.042); g.fill();
  g.strokeStyle='rgba(0,229,255,0.32)'; g.lineWidth=Math.max(1,R*0.007);
  rr(g,L-R*0.185,-R*0.108,R*0.150,R*0.216,R*0.042); g.stroke();
  g.restore();

  /* ---- mão ---- */
  g.save(); g.translate(hx,hy); g.rotate(ha); if(side<0) g.scale(1,-1);

  // dedos curvando por cima do aro (para dentro = -x local)
  for(j=0;j<4;j++){
    var fy=-R*0.108+j*R*0.072;
    var fl=R*(0.152-Math.abs(j-1.5)*0.013)*(1+flex*0.05);
    g.save(); g.translate(-R*0.062,fy); g.rotate(flex*0.09*(j-1.5));
    var fg=g.createLinearGradient(0,-R*0.030,0,R*0.030);
    fg.addColorStop(0,'#4a3670'); fg.addColorStop(0.50,'#2a1e47'); fg.addColorStop(1,'#140d24');
    g.fillStyle=fg; rr(g,-fl,-R*0.030,fl,R*0.060,R*0.025); g.fill();
    g.strokeStyle='rgba(0,0,0,0.55)'; g.lineWidth=Math.max(1,R*0.005);
    rr(g,-fl,-R*0.030,fl,R*0.060,R*0.025); g.stroke();
    g.fillStyle='rgba(226,214,255,0.07)';
    rr(g,-fl+R*0.012,-R*0.019,R*0.028,R*0.038,R*0.013); g.fill();
    g.restore();
  }
  // dorso da mão
  var pgr=g.createLinearGradient(-R*0.07,0,R*0.11,0);
  pgr.addColorStop(0,'#1b1330'); pgr.addColorStop(0.42,'#3d2c60'); pgr.addColorStop(1,'#221838');
  g.fillStyle=pgr;
  rr(g,-R*0.068,-R*0.146,R*0.176,R*0.292,R*0.052); g.fill();
  g.strokeStyle='rgba(0,0,0,0.55)'; g.lineWidth=Math.max(1,R*0.007);
  rr(g,-R*0.068,-R*0.146,R*0.176,R*0.292,R*0.052); g.stroke();
  // nervuras e costura do dorso
  g.strokeStyle='rgba(196,178,245,0.13)'; g.lineWidth=Math.max(1,R*0.0045);
  for(j=0;j<3;j++){
    var yy=-R*0.078+j*R*0.078;
    g.beginPath(); g.moveTo(-R*0.048,yy); g.lineTo(R*0.088,yy); g.stroke();
  }
  // faixa neon nas costas da luva
  g.fillStyle='rgba(255,47,135,0.30)';
  rr(g,-R*0.040,-R*0.146,R*0.028,R*0.292,R*0.012); g.fill();
  e.save(); e.translate(hx,hy); e.rotate(ha); if(side<0) e.scale(1,-1);
  e.fillStyle='rgba(255,47,135,0.45)';
  rr(e,-R*0.040,-R*0.146,R*0.028,R*0.292,R*0.012); e.fill();
  e.restore();
  // polegar seguindo o aro para cima
  g.save(); g.translate(R*0.026,-R*0.128); g.rotate(-0.52);
  var tg2=g.createLinearGradient(0,-R*0.028,0,R*0.028);
  tg2.addColorStop(0,'#4e3a76'); tg2.addColorStop(1,'#191130');
  g.fillStyle=tg2; rr(g,-R*0.022,-R*0.029,R*0.150,R*0.058,R*0.025); g.fill();
  g.strokeStyle='rgba(0,0,0,0.5)'; g.lineWidth=Math.max(1,R*0.005);
  rr(g,-R*0.022,-R*0.029,R*0.150,R*0.058,R*0.025); g.stroke();
  g.restore();
  g.restore();
}

/* conteúdo vivo do retrovisor: pista fugindo para trás */
function drawMirror(g,e,mx,my,mw,mh,spN){
  var i, t;
  g.save();
  rr(g,mx,my,mw,mh,mh*0.22); g.clip();
  var sky=g.createLinearGradient(0,my,0,my+mh);
  sky.addColorStop(0, css(pal.skyMid,0.85));
  sky.addColorStop(0.44, css(pal.horizon,0.55));
  sky.addColorStop(0.46,'rgba(10,6,20,0.95)');
  sky.addColorStop(1,'rgba(4,2,10,0.98)');
  g.fillStyle=sky; g.fillRect(mx,my,mw,mh);
  // asfalto fugindo
  var vy=my+mh*0.46, cxm=mx+mw*0.5;
  g.fillStyle='rgba(22,14,38,0.92)';
  g.beginPath(); g.moveTo(cxm-mw*0.055,vy); g.lineTo(cxm+mw*0.055,vy);
  g.lineTo(cxm+mw*0.62,my+mh); g.lineTo(cxm-mw*0.62,my+mh); g.closePath(); g.fill();
  // faixas centrais correndo
  for(i=0;i<5;i++){
    t=((sunPulse*(0.55+spN*2.4)+i*0.20)%1);
    var tt=t*t;
    var ly=vy+(mh*0.54)*tt, lw=mw*(0.012+0.055*tt), lh=mh*(0.020+0.075*tt);
    g.fillStyle='rgba(255,236,255,'+(0.20+0.55*tt).toFixed(2)+')';
    g.fillRect(cxm-lw*0.5, ly, lw, lh);
  }
  // guias de neon nas bordas
  for(i=0;i<2;i++){
    var sgn=i?1:-1;
    var grd=g.createLinearGradient(cxm,vy,cxm+sgn*mw*0.62,my+mh);
    grd.addColorStop(0, css(pal.neon,0.0));
    grd.addColorStop(1, css(pal.neon,0.55));
    g.strokeStyle=grd; g.lineWidth=Math.max(1,mh*0.045);
    g.beginPath(); g.moveTo(cxm+sgn*mw*0.055,vy); g.lineTo(cxm+sgn*mw*0.62,my+mh); g.stroke();
  }
  g.restore();
  // brilho do próprio escapamento quando no nitro
  if(boosting>0.05){
    e.save(); rr(e,mx,my,mw,mh,mh*0.22); e.clip();
    e.fillStyle='rgba(120,220,255,'+(boosting*0.30).toFixed(2)+')';
    e.fillRect(mx,my+mh*0.50,mw,mh*0.50);
    e.restore();
  }
  // vidro do espelho
  g.save();
  rr(g,mx,my,mw,mh,mh*0.22); g.clip();
  var mgl=g.createLinearGradient(mx,my,mx+mw*0.6,my+mh);
  mgl.addColorStop(0,'rgba(220,232,255,0.13)'); mgl.addColorStop(0.5,'rgba(220,232,255,0.02)');
  mgl.addColorStop(1,'rgba(220,232,255,0)');
  g.fillStyle=mgl; g.fillRect(mx,my,mw,mh);
  g.restore();
}

function drawCockpit(){
  if(!COCK) COCK=buildCockpit();
  sctx.drawImage(COCK.img,0,0);
  ectx.drawImage(COCK.glow,0,0);

  var spN=clamp(speed/maxSpeed,0,1);
  var gf=spN*5.9, gear=Math.min(6,1+Math.floor(gf)), frac=gf-Math.floor(gf);
  var rpm = speed>1 ? clamp(0.16+frac*0.76+boosting*0.14+(ctrl.gasA||0)*0.04,0,1)
                    : 0.10+Math.sin(sunPulse*7)*0.014;
  var vib = (0.0016+spN*0.0040+boosting*0.0060)*H*Math.sin(sunPulse*47);
  var binY=COCK.binY, gr=COCK.gr, i;
  var A0=PI*0.75, SW=PI*1.5;

  /* ---- conta-giros ---- */
  var tx=COCK.tachoX, ty=COCK.gaugeY+vib, ta=A0+SW*rpm;
  if(rpm>0.80){
    ectx.save(); ectx.globalCompositeOperation='lighter';
    ectx.strokeStyle='rgba(255,45,90,'+((rpm-0.80)*3.2).toFixed(2)+')';
    ectx.lineWidth=gr*0.10;
    ectx.beginPath(); ectx.arc(tx,ty,gr*0.845,A0+SW*0.80,ta,false); ectx.stroke();
    ectx.restore();
  }
  needle(sctx,tx,ty,gr*0.80,ta,gr*0.085,'rgba(0,0,0,0.55)');
  needle(sctx,tx,ty,gr*0.78,ta,gr*0.060,rpm>0.80?'#ff3355':'#ff5f9e');
  needle(ectx,tx,ty,gr*0.78,ta,gr*0.060,rpm>0.80?'#ff3355':'#ff5f9e');
  sctx.fillStyle='#1a1233'; sctx.beginPath(); sctx.arc(tx,ty,gr*0.10,0,PI*2); sctx.fill();
  sctx.fillStyle='#3d2f63'; sctx.beginPath(); sctx.arc(tx,ty,gr*0.055,0,PI*2); sctx.fill();

  /* ---- velocímetro analógico ---- */
  var vx2=COCK.speedoX, vy2=COCK.gaugeY+vib, va=A0+SW*spN;
  needle(sctx,vx2,vy2,gr*0.80,va,gr*0.085,'rgba(0,0,0,0.55)');
  needle(sctx,vx2,vy2,gr*0.78,va,gr*0.060,'#9df9ff');
  needle(ectx,vx2,vy2,gr*0.78,va,gr*0.060,'#9df9ff');
  sctx.fillStyle='#1a1233'; sctx.beginPath(); sctx.arc(vx2,vy2,gr*0.10,0,PI*2); sctx.fill();
  sctx.fillStyle='#3d2f63'; sctx.beginPath(); sctx.arc(vx2,vy2,gr*0.055,0,PI*2); sctx.fill();

  /* ---- barras de temperatura e energia ---- */
  var temp=clamp(0.30+spN*0.26+boosting*0.34,0,1);
  var nrg =clamp(nitroCharges/NITRO_MAX,0,1);
  drawBar(sctx,ectx,COCK.tempX,COCK.barY+vib,COCK.barW,COCK.barH,temp,'#ffd166',true);
  drawBar(sctx,ectx,COCK.nrgX, COCK.barY+vib,COCK.barW,COCK.barH,nrg, '#9df9ff',false);

  /* ---- leitura digital de velocidade, marcha e hodômetro ---- */
  var dx=W*0.500, dy=binY+H*0.086+vib;
  var kmh=Math.floor(spN*360);
  var dcol = boosting>0.1?'#9df9ff':'#ffffff';
  var fs=Math.min(W*0.052,H*0.064)|0;
  sctx.font=ectx.font='italic 900 '+fs+'px "Arial Black",Arial,sans-serif';
  sctx.textAlign=ectx.textAlign='center'; sctx.textBaseline=ectx.textBaseline='alphabetic';
  sctx.fillStyle=ectx.fillStyle=dcol;
  sctx.fillText(String(kmh),dx,dy); ectx.fillText(String(kmh),dx,dy);
  var ls=Math.max(7,(fs*0.26)|0);
  sctx.font='900 '+ls+'px "Arial Black",Arial,sans-serif';
  sctx.fillStyle='rgba(0,229,255,0.75)';
  sctx.fillText('KM/H',dx,dy+ls*1.8);
  // marcha, com a trilha de marchas ao redor
  sctx.font=ectx.font='italic 900 '+(fs*0.62|0)+'px "Arial Black",Arial,sans-serif';
  sctx.fillStyle=ectx.fillStyle='#ffe066';
  sctx.fillText(String(gear),dx,dy-fs*0.94); ectx.fillText(String(gear),dx,dy-fs*0.94);
  sctx.font='900 '+Math.max(6,(fs*0.22)|0)+'px "Arial Black",Arial,sans-serif';
  for(i=1;i<=6;i++){
    var gxp=dx+(i-3.5)*fs*0.30;
    sctx.fillStyle = (i===gear) ? 'rgba(255,224,102,0.95)' : 'rgba(120,104,170,0.45)';
    sctx.fillText(String(i), gxp, dy-fs*1.44);
  }
  // hodômetro
  sctx.font='900 '+Math.max(6,(fs*0.24)|0)+'px "Arial Black",Arial,sans-serif';
  sctx.fillStyle='rgba(190,172,240,0.60)';
  sctx.fillText((distance/1000).toFixed(1)+' KM', dx, dy+ls*3.4);

  /* ---- luzes de aviso ---- */
  var wy=binY+H*0.200+vib, ws=Math.min(W*0.010,H*0.012);
  var steer=Math.abs(visYaw);
  var blink=(Math.sin(sunPulse*11)>0);
  var warn=[
    [dx-ws*7.6, (steer>0.30&&visYaw<0&&blink)?1:0, '#7dffb0'],
    [dx-ws*3.8, ctrl.brake?1:0,                    '#ff3355'],
    [dx,        boosting>0.05?1:0,                 '#00e5ff'],
    [dx+ws*3.8, nitroCharges>0?1:0,                '#ffe066'],
    [dx+ws*7.6, (steer>0.30&&visYaw>0&&blink)?1:0, '#7dffb0']
  ];
  for(i=0;i<warn.length;i++){
    var on=warn[i][1];
    sctx.fillStyle = on ? warn[i][2] : 'rgba(70,60,105,0.55)';
    sctx.beginPath(); sctx.arc(warn[i][0],wy,ws,0,PI*2); sctx.fill();
    if(on){ ectx.fillStyle=warn[i][2]; ectx.beginPath(); ectx.arc(warn[i][0],wy,ws*1.15,0,PI*2); ectx.fill(); }
  }

  /* ---- tela do console: volta, pontos e progresso ---- */
  if(COCK.hasStack){
    var scx=COCK.scx, scy=COCK.scy, scw=COCK.scw, sch=COCK.sch;
    sctx.save(); rr(sctx,scx,scy,scw,sch,H*0.008); sctx.clip();
    sctx.font='900 '+Math.max(7,(H*0.019)|0)+'px "Arial Black",Arial,sans-serif';
    sctx.textAlign='left'; sctx.textBaseline='alphabetic';
    sctx.fillStyle='rgba(0,229,255,0.85)';
    sctx.fillText('VOLTA '+laps, scx+scw*0.07, scy+sch*0.30);
    sctx.fillStyle='rgba(255,224,102,0.90)';
    sctx.fillText(String(Math.floor(score)).padStart(6,'0'), scx+scw*0.07, scy+sch*0.62);
    // barra de progresso da volta
    var pw=scw*0.86*clamp(position/trackLength,0,1);
    sctx.fillStyle='rgba(60,48,96,0.70)';
    sctx.fillRect(scx+scw*0.07, scy+sch*0.76, scw*0.86, H*0.005);
    sctx.fillStyle='rgba(255,47,135,0.85)';
    sctx.fillRect(scx+scw*0.07, scy+sch*0.76, pw, H*0.005);
    ectx.fillStyle='rgba(255,47,135,0.85)';
    ectx.fillRect(scx+scw*0.07, scy+sch*0.76, pw, H*0.005);
    // equalizador reagindo à rotação
    for(i=0;i<7;i++){
      var eh=sch*0.40*(0.20+0.80*Math.abs(Math.sin(sunPulse*(5+i*1.7)+i))*rpm);
      sctx.fillStyle='rgba(0,229,255,'+(0.25+0.45*rpm).toFixed(2)+')';
      sctx.fillRect(scx+scw*(0.62+i*0.050), scy+sch*0.56-eh, scw*0.030, eh);
    }
    sctx.restore();
    sctx.textAlign='center';
  }

  /* ---- volante ---- */
  var Wl=COCK.wheel, R=Wl.R, cxw=W*0.5, cyw=wheelCY()+vib*1.6;
  var ang=visYaw*0.92 + driftAngle*0.16;
  sctx.save(); sctx.translate(cxw,cyw); sctx.rotate(ang);
  sctx.drawImage(Wl.img,-Wl.size/2,-Wl.size/2);
  // fita de LEDs de troca no topo do aro
  var lit=Math.floor(clamp((rpm-0.34)/0.60,0,1)*9);
  for(var li=0;li<9;li++){
    var la=PI*1.5+(li-4)*0.062;
    var lx=Math.cos(la)*R*0.845, ly=Math.sin(la)*R*0.845;
    var onL=li<lit;
    var lc = li>6?'#ff2f55' : (li>3?'#ffe066':'#7dffb0');
    sctx.save(); sctx.translate(lx,ly); sctx.rotate(la+PI/2);
    sctx.fillStyle = onL?lc:'rgba(48,40,78,0.75)';
    rr(sctx,-R*0.017,-R*0.010,R*0.034,R*0.020,R*0.006); sctx.fill();
    sctx.restore();
    if(onL){
      ectx.save(); ectx.translate(cxw,cyw); ectx.rotate(ang);
      ectx.translate(lx,ly); ectx.rotate(la+PI/2);
      ectx.fillStyle=lc; rr(ectx,-R*0.020,-R*0.012,R*0.040,R*0.024,R*0.007); ectx.fill();
      ectx.restore();
    }
  }
  sctx.restore();
  ectx.save(); ectx.translate(cxw,cyw); ectx.rotate(ang);
  ectx.drawImage(Wl.glow,-Wl.size/2,-Wl.size/2);
  ectx.restore();

  /* ---- mãos do piloto no aro ---- */
  if(quality>0){
    var flex=clamp(Math.abs(visYaw)*1.3+Math.abs(driftAngle)*0.8,0,1);
    drawGlove(sctx,ectx,cxw,cyw,R,ang,-1,flex);
    drawGlove(sctx,ectx,cxw,cyw,R,ang, 1,flex);
  }

  /* ---- retrovisor com a pista fugindo ---- */
  if(quality>0) drawMirror(sctx,ectx,W*0.379,H*0.063,W*0.242,H*0.042,spN);

  /* ---- pingente balançando com a força lateral ---- */
  if(quality>0){
    var sw=-(visYaw*0.62 + driftAngle*0.34);
    var px=W*0.500+Math.sin(sw)*H*0.030, py=H*0.112+Math.cos(sw)*H*0.030;
    sctx.strokeStyle='rgba(190,172,240,0.35)'; sctx.lineWidth=Math.max(1,H*0.0016);
    sctx.beginPath(); sctx.moveTo(W*0.500,H*0.112); sctx.lineTo(px,py); sctx.stroke();
    sctx.fillStyle='rgba(255,47,135,0.70)';
    sctx.beginPath();
    sctx.moveTo(px,py-H*0.010); sctx.lineTo(px+H*0.009,py); sctx.lineTo(px,py+H*0.012);
    sctx.lineTo(px-H*0.009,py); sctx.closePath(); sctx.fill();
    ectx.fillStyle='rgba(255,47,135,0.55)';
    ectx.beginPath();
    ectx.moveTo(px,py-H*0.010); ectx.lineTo(px+H*0.009,py); ectx.lineTo(px,py+H*0.012);
    ectx.lineTo(px-H*0.009,py); ectx.closePath(); ectx.fill();
  }

  /* ---- reflexo no para-brisa acompanhando o volante ---- */
  if(quality>0){
    var glx=W*0.5 - visYaw*W*0.16;
    var gl=sctx.createLinearGradient(glx-W*0.30,0,glx+W*0.30,COCK.hoodY);
    gl.addColorStop(0,'rgba(190,225,255,0)');
    gl.addColorStop(0.5,'rgba(190,225,255,'+(0.030+boosting*0.045).toFixed(3)+')');
    gl.addColorStop(1,'rgba(190,225,255,0)');
    sctx.fillStyle=gl; sctx.fillRect(0,0,W,COCK.hoodY);
    // reflexo do painel na base do vidro
    var dr=sctx.createLinearGradient(0,COCK.hoodY-H*0.10,0,COCK.hoodY+H*0.02);
    dr.addColorStop(0,'rgba(255,47,135,0)');
    dr.addColorStop(1,'rgba(255,47,135,'+(0.045+rpm*0.050).toFixed(3)+')');
    sctx.fillStyle=dr; sctx.fillRect(0,COCK.hoodY-H*0.10,W,H*0.12);
  }
}

/* ---------- partículas e efeitos de velocidade ---------- */
function renderParticles(){
  var i;
  for(i=0;i<particles.length;i++){
    var p=particles[i];
    var a=p.life*(p.type?0.32:0.24);
    var col = p.type ? css(pal.horizon,a) : 'rgba(255,235,255,'+a.toFixed(3)+')';
    sctx.fillStyle=col;
    sctx.beginPath(); sctx.arc(p.x*W, p.y*H, p.size*W, 0, PI*2); sctx.fill();
  }
  for(i=0;i<sparks.length;i++){
    var s=sparks[i];
    var c='rgba(255,'+(160+90*s.life|0)+',80,'+s.life.toFixed(2)+')';
    sctx.fillStyle=c; ectx.fillStyle=c;
    sctx.fillRect(s.x*W, s.y*H, s.size, s.size);
    ectx.fillRect(s.x*W, s.y*H, s.size*1.6, s.size*1.6);
  }
  for(i=0;i<floats.length;i++){
    var fl=floats[i];
    var a2=clamp(fl.life,0,1);
    ectx.font='italic 900 '+(W*0.030|0)+'px "Arial Black",Arial,sans-serif';
    ectx.textAlign='center'; ectx.fillStyle='rgba(255,224,102,'+a2.toFixed(2)+')';
    ectx.fillText(fl.txt, fl.x*W, fl.y*H);
    sctx.font=ectx.font; sctx.textAlign='center';
    sctx.fillStyle='rgba(255,240,190,'+a2.toFixed(2)+')';
    sctx.fillText(fl.txt, fl.x*W, fl.y*H);
  }
}

function renderSpeedLines(){
  var sp=speed/maxSpeed;
  var intensity = clamp((sp-0.55)/0.45,0,1)*0.55 + boosting*0.75;
  if(intensity<=0.02) return;
  var cxp=W/2, cyp=horizonY;
  ectx.save();
  ectx.globalCompositeOperation='lighter';
  for(var i=0;i<26;i++){
    var a=(i/26)*PI*2 + sunPulse*0.4;
    var r0=Math.min(W,H)*rand(0.30,0.48), r1=r0+Math.min(W,H)*rand(0.16,0.45)*intensity;
    ectx.strokeStyle = 'rgba(200,230,255,'+(0.06+0.16*intensity)*Math.random()+')';
    ectx.lineWidth = rand(1,3.4);
    ectx.beginPath();
    ectx.moveTo(cxp+Math.cos(a)*r0, cyp+Math.sin(a)*r0*0.8);
    ectx.lineTo(cxp+Math.cos(a)*r1, cyp+Math.sin(a)*r1*0.8);
    ectx.stroke();
  }
  ectx.restore();
}

/* ---------- HUD ---------- */
function hudText(txt,x,y,size,color,align,italic){
  var font=(italic?'italic ':'')+'900 '+(size|0)+'px "Arial Black",Arial,sans-serif';
  sctx.font=font; ectx.font=font;
  sctx.textAlign=align; ectx.textAlign=align;
  sctx.textBaseline='alphabetic'; ectx.textBaseline='alphabetic';
  sctx.fillStyle=color; ectx.fillStyle=color;
  sctx.fillText(txt,x,y); ectx.fillText(txt,x,y);
}
function hudLabel(txt,x,y,size,color,align){
  var font='700 '+(size|0)+'px ui-monospace,"Courier New",monospace';
  sctx.font=font; ectx.font=font;
  sctx.textAlign=align; ectx.textAlign=align;
  sctx.fillStyle=color; ectx.fillStyle=color;
  sctx.fillText(txt,x,y); ectx.fillText(txt,x,y);
}
function bar(x,y,w,h,pct,c1,c2){
  sctx.fillStyle='rgba(8,4,18,0.55)'; rr(sctx,x,y,w,h,h/2); sctx.fill();
  sctx.strokeStyle=c2; sctx.lineWidth=Math.max(1,h*0.10); rr(sctx,x,y,w,h,h/2); sctx.stroke();
  ectx.strokeStyle=c2; ectx.lineWidth=Math.max(1,h*0.10); rr(ectx,x,y,w,h,h/2); ectx.stroke();
  var iw=(w-h*0.34)*clamp(pct,0,1);
  if(iw>1){
    sctx.fillStyle=c1; rr(sctx,x+h*0.17,y+h*0.17,iw,h*0.66,h*0.33); sctx.fill();
    ectx.fillStyle=c1; rr(ectx,x+h*0.17,y+h*0.17,iw,h*0.66,h*0.33); ectx.fill();
  }
}
function boltIcon(g,x,y,s){
  g.beginPath();
  g.moveTo(x+s*0.58,y); g.lineTo(x+s*0.16,y+s*0.46); g.lineTo(x+s*0.44,y+s*0.46);
  g.lineTo(x+s*0.30,y+s*1.00); g.lineTo(x+s*0.76,y+s*0.42); g.lineTo(x+s*0.46,y+s*0.42);
  g.lineTo(x+s*0.62,y); g.closePath(); g.fill();
}
function renderHUD(){
  if(state==='menu') return;
  var u=Math.min(W*0.012, H*0.022), m=W*0.035, top=H*0.085;

  hudLabel(numP===2?('JOGADOR '+(curP+1)):'PONTOS', m, top-u*2.4, u*1.05,
            numP===2?css(pal.rumble2,0.95):css(pal.sun1,0.75),'left');
  hudText(String(Math.floor(score)).padStart(8,'0'), m, top+u*0.6, u*2.5, '#ffe066','left',true);

  var tCol = timeLeft<11 ? (Math.floor(sunPulse*6)%2 ? '#ff3355' : '#ffffff') : '#ffffff';
  hudLabel('TEMPO', W/2, top-u*2.4, u*1.05, css(pal.sun1,0.75),'center');
  hudText(timeLeft.toFixed(1), W/2, top+u*1.4, u*4.0, tCol,'center',true);

  hudLabel('VOLTA', W-m, top-u*2.4, u*1.05, css(pal.sun1,0.75),'right');
  hudText(String(laps), W-m, top+u*0.6, u*2.5, '#00e5ff','right',true);

  // velocímetro
  var kmh = Math.floor(speed/maxSpeed*360);
  var by=H-H*0.075;
  hudText(String(kmh), W-m, by, u*5.2, boosting>0.1?'#9df9ff':'#ffffff','right',true);
  hudLabel('KM/H', W-m, by+u*1.6, u*1.15, css(pal.neon,0.9),'right');

  // marcha
  var gear = Math.min(6, 1+Math.floor(speed/maxSpeed*5.9));
  hudText('M'+gear, W-m-u*9.2, by, u*2.6, css(pal.rumble2),'right',true);

  // cargas de nitro
  var bw=W*0.20;
  hudLabel('NITRO', m, by-u*3.3, u*1.05, css(pal.sun1,0.8),'left');
  for(var nb=0;nb<NITRO_MAX;nb++){
    var onC = nb<nitroCharges, bx0=m+nb*u*2.0, by0=by-u*2.8;
    sctx.fillStyle = onC?(boostT>0?'#ffffff':'#9df9ff'):'rgba(150,140,190,0.26)';
    boltIcon(sctx,bx0,by0,u*2.4);
    if(onC){ ectx.fillStyle=(boostT>0?'#ffffff':'#9df9ff'); boltIcon(ectx,bx0,by0,u*2.4); }
  }

  // progresso da volta
  var pw=W*0.20, py=by+u*1.6;
  bar(m, py, pw, u*0.7, (position/trackLength), css(pal.neon), css(pal.neon,0.5));

  // combo
  if(combo>1){
    hudText('x'+combo, m+bw+u*2.6, by, u*2.8, '#ffe066','left',true);
  }

  // bioma / hora
  hudLabel(BIOMES[curBiome].name+'  ·  '+pal.name, W/2, H-u*2.7, u*1.15, css(pal.neon,0.85),'center');
  hudLabel(QNAME[quality]+'  ·  '+(camMode?'INTERNA':'EXTERNA'), W/2, H-u*1.2, u*0.95, css(pal.sun1,0.45),'center');

  if(pDead){
    sctx.fillStyle='rgba(9,2,16,0.58)'; sctx.fillRect(0,0,W,H);
    hudText('TEMPO ESGOTADO', W/2, H*0.52, u*2.8, '#ff5577','center',true);
  }

  // aviso de checkpoint
  if(checkpointFlash>0){
    var a=clamp(checkpointFlash/1.6,0,1);
    hudText('CHECKPOINT  +22s', W/2, H*0.40, u*3.4, 'rgba(255,255,255,'+a.toFixed(2)+')','center',true);
  }
}

/* ---------- pós-processamento ---------- */
function composite(){
  if(safeMode){
    vctx.setTransform(1,0,0,1,0,0);
    vctx.globalAlpha=1; vctx.globalCompositeOperation='source-over';
    vctx.clearRect(0,0,W,H);
    vctx.drawImage(scene,0,0,W,H);
    vctx.globalCompositeOperation='lighter';
    vctx.drawImage(emis,0,0,W,H);
    vctx.globalCompositeOperation='source-over';
    return;
  }
  var sp=gSpd/maxSpeed;
  var caAmt = (clamp((sp-0.6)/0.4,0,1)*3.2 + gBoost*7 + gFlash*9) * (W/1200);

  vctx.setTransform(1,0,0,1,0,0);
  vctx.globalCompositeOperation='source-over';
  vctx.globalAlpha=1;

  // tremor de câmera
  var sh = gShake*W*0.010 + gBoost*W*0.0016;
  shakeX = rand(-sh,sh); shakeY = rand(-sh,sh);
  var over = 1 + (sh>0.2 ? (sh/W)*2.6 : 0);
  vctx.save();
  vctx.translate(W/2+shakeX, H/2+shakeY);
  vctx.scale(over,over);
  vctx.translate(-W/2,-H/2);

  if(caAmt>0.8 && quality>=1){
    rctx.setTransform(1,0,0,1,0,0); rctx.globalCompositeOperation='source-over';
    rctx.clearRect(0,0,CW,CH); rctx.drawImage(scene,0,0,CW,CH);
    rctx.globalCompositeOperation='multiply'; rctx.fillStyle='#ff0000'; rctx.fillRect(0,0,CW,CH);
    cctx.setTransform(1,0,0,1,0,0); cctx.globalCompositeOperation='source-over';
    cctx.clearRect(0,0,CW,CH); cctx.drawImage(scene,0,0,CW,CH);
    cctx.globalCompositeOperation='multiply'; cctx.fillStyle='#00ffff'; cctx.fillRect(0,0,CW,CH);
    vctx.drawImage(caR, -caAmt, 0, W, H);
    vctx.globalCompositeOperation='lighter';
    vctx.drawImage(caC,  caAmt, 0, W, H);
    vctx.globalCompositeOperation='source-over';
  } else {
    vctx.drawImage(scene,0,0,W,H);
  }

  // bloom
  bctx.setTransform(1,0,0,1,0,0);
  bctx.clearRect(0,0,BW,BH);
  if(hasFilter) bctx.filter='blur(1.4px)';
  bctx.drawImage(emis,0,0,BW,BH);
  if(hasFilter) bctx.filter='none';

  vctx.globalCompositeOperation='lighter';
  vctx.globalAlpha=0.95;
  vctx.drawImage(bloom,0,0,W,H);
  vctx.globalAlpha=0.55;
  vctx.drawImage(emis,0,0,W,H);
  vctx.globalAlpha=1;
  vctx.globalCompositeOperation='source-over';
  vctx.restore();

  // flash de impacto
  if(gFlash>0.01){
    vctx.globalCompositeOperation='lighter';
    vctx.fillStyle='rgba(255,120,150,'+(gFlash*0.35).toFixed(3)+')';
    vctx.fillRect(0,0,W,H);
    vctx.globalCompositeOperation='source-over';
  }

  if(quality>=1){
    // scanlines
    var pat=vctx.createPattern(scan,'repeat');
    if(pat){
      vctx.save();
      vctx.scale(1, Math.max(1,H/600));
      vctx.fillStyle=pat; vctx.globalAlpha=0.5;
      vctx.fillRect(0,0,W,H);
      vctx.restore(); vctx.globalAlpha=1;
    }
    // grão
    var gp=vctx.createPattern(grain,'repeat');
    if(gp){
      vctx.save();
      vctx.translate((Math.random()*160)|0, (Math.random()*160)|0);
      vctx.globalCompositeOperation='overlay'; vctx.globalAlpha=0.22;
      vctx.fillStyle=gp; vctx.fillRect(-160,-160,W+320,H+320);
      vctx.restore();
      vctx.globalAlpha=1; vctx.globalCompositeOperation='source-over';
    }
  }
  // vinheta
  vctx.drawImage(vign,0,0,W,H);
}

/* ---------- render principal ---------- */
function renderView(vx,vy,vw,vh){
  var oW=W, oH=H;
  W=vw; H=vh;
  sctx.save(); sctx.translate(vx,vy);
  sctx.beginPath(); sctx.rect(0,0,vw,vh); sctx.clip();
  ectx.save(); ectx.translate(vx,vy);
  ectx.beginPath(); ectx.rect(0,0,vw,vh); ectx.clip();
  updatePalette(dayPhase);
  frameColors();
  renderSky();
  renderRoad();
  renderSkyGlow();
  renderParticles();
  if(camMode===1) drawCockpit(); else renderPlayer();
  renderSpeedLines();
  renderHUD();
  sctx.restore(); ectx.restore();
  W=oW; H=oH;
}
function drawDivider(){
  var t=Math.max(2,Math.round(Math.min(W,H)*0.005));
  var nc=css(pal.neon,0.9);
  if(H>=W*0.8){
    var y=Math.floor(H/2);
    sctx.fillStyle='#07040e'; sctx.fillRect(0,y-t*1.6,W,t*3.2);
    sctx.fillStyle=nc; sctx.fillRect(0,y-t*0.5,W,t);
    ectx.fillStyle=nc; ectx.fillRect(0,y-t*0.5,W,t);
  } else {
    var x=Math.floor(W/2);
    sctx.fillStyle='#07040e'; sctx.fillRect(x-t*1.6,0,t*3.2,H);
    sctx.fillStyle=nc; sctx.fillRect(x-t*0.5,0,t,H);
    ectx.fillStyle=nc; ectx.fillRect(x-t*0.5,0,t,H);
  }
}
function render(){
  sctx.setTransform(1,0,0,1,0,0);
  sctx.globalAlpha=1; sctx.globalCompositeOperation='source-over';
  sctx.clearRect(0,0,W,H);
  ectx.setTransform(0.5,0,0,0.5,0,0);
  ectx.globalAlpha=1; ectx.globalCompositeOperation='source-over';
  ectx.clearRect(0,0,W,H);

  ensurePlayers();
  gShake=0; gFlash=0; gSpd=0; gBoost=0;
  var pi, vp;
  for(pi=0; pi<numP; pi++){
    curP=pi; loadP(players[pi]);
    vp=viewportOf(pi);
    renderView(vp[0],vp[1],vp[2],vp[3]);
    if(shake>gShake) gShake=shake;
    if(flash>gFlash) gFlash=flash;
    if(speed>gSpd) gSpd=speed;
    if(boosting>gBoost) gBoost=boosting;
    saveP(players[pi]);
  }
  if(numP===2) drawDivider();
  composite();
}

    elPause=document.getElementById('pause'), elFinal=document.getElementById('finalScore'),
