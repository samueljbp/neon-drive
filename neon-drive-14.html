<style>

             text-shadow:0 0 8px #fff6c9,0 0 34px #ffb300}
  .lbl{font-family:ui-monospace,"Courier New",monospace;font-size:12px;letter-spacing:.3em;color:#9d8ac2;margin-top:18px}

  #touch{--b:max(16px,env(safe-area-inset-bottom))}
  #touch .pad.cyan{background:rgba(0,229,255,.10);border-color:rgba(0,229,255,.45);text-shadow:0 0 12px #00e5ff}

  #touch #tB{right:31vw}

  body.touch.two #touch2{display:block}
  #touch2 .pad{position:absolute;bottom:calc(50% + 12px);width:16vw;max-width:78px;height:16vw;max-height:78px;

  #touch2 .pad:active{background:rgba(255,255,255,.30)}

  #touch2 #uR{left:21vw;font-size:19px;font-style:normal}

  #touch2 #uA{right:3vw;background:rgba(0,229,255,.16);border-color:rgba(0,229,255,.60);
              text-shadow:0 0 10px #00e5ff}
  #game,#touch .pad{touch-action:none}
  #err{display:none;position:fixed;left:0;right:0;bottom:0;z-index:99;max-height:46vh;overflow:auto;
       background:rgba(34,0,14,.96);border-top:3px solid #ff2f87;color:#ffc2d4;padding:14px 16px;

       -webkit-user-select:text;user-select:text}

<script>
window.__err=function(msg){
  var e=document.getElementById('err');
  if(!e){ alert(msg); return; }
  e.style.display='block';
  e.textContent += msg + "\n\n";
};
window.addEventListener('error',function(ev){
  var m='ERRO: '+ev.message+'\nlinha '+(ev.lineno||'?')+':'+(ev.colno||'?');
  if(ev.error && ev.error.stack) m += '\n'+ev.error.stack.split('\n').slice(0,5).join('\n');
  window.__err(m);
});
window.addEventListener('unhandledrejection',function(ev){ window.__err('PROMISE: '+ev.reason); });
</script>

<script>
(function(){
"use strict";

/* ══════════════════════════════════════════════════════════════
   NEON DRIVE — motor pseudo-3D estilo OutRun
   Canvas 2D · bloom · aberração cromática · áudio procedural
   ══════════════════════════════════════════════════════════════ */

/* ---------- utilidades ---------- */
var PI = Math.PI;
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function rand(a,b){ return a+Math.random()*(b-a); }
function randi(a,b){ return Math.floor(a+Math.random()*(b-a+1)); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function easeIn(a,b,p){ return a+(b-a)*Math.pow(p,2); }
function easeOut(a,b,p){ return a+(b-a)*(1-Math.pow(1-p,2)); }
function easeInOut(a,b,p){ return a+(b-a)*(0.5-Math.cos(p*PI)/2); }
function increase(start,inc,max){ var r=start+inc; while(r>=max) r-=max; while(r<0) r+=max; return r; }
function hexRgb(h){ h=h.replace('#',''); return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)]; }
function mixRgb(a,b,t){ return [lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)]; }
function css(c,a){
  if(!c) throw new Error('css(): cor indefinida — chave de paleta inexistente?');
  return a===undefined
  ? 'rgb('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+')'
  : 'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+a+')'; }
function shade(c,f){ return [clamp(c[0]*f,0,255),clamp(c[1]*f,0,255),clamp(c[2]*f,0,255)]; }
function cv(w,h){ var c=document.createElement('canvas'); c.width=Math.max(1,w|0); c.height=Math.max(1,h|0); return c; }
function rr(g,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  g.beginPath(); g.moveTo(x+r,y);
  g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r);     g.arcTo(x,y,x+w,y,r); g.closePath();
}

/* ---------- canvas e buffers ---------- */
var view = document.getElementById('game');
var vctx = view.getContext('2d');
var scene = cv(2,2), sctx = scene.getContext('2d');   // cena principal
var emis  = cv(2,2), ectx = emis.getContext('2d');    // camada emissiva (metade da resolução)
var bloom = cv(2,2), bctx = bloom.getContext('2d');   // bloom (1/8)
var caR   = cv(2,2), rctx = caR.getContext('2d');     // canal vermelho
var caC   = cv(2,2), cctx = caC.getContext('2d');     // canal ciano
var grain = null, scan = null, vign = null, sunCv = cv(560,560);

var W=0, H=0, EW=0, EH=0, BW=0, BH=0, CW=0, CH=0;
var quality = 2;                 // 0 baixo · 1 médio · 2 alto
var QNAME = ['BAIXA','MÉDIA','ALTA'];
var hasFilter = (typeof sctx.filter === 'string');

function resize(){
  var cw = view.clientWidth  || window.innerWidth;
  var ch = view.clientHeight || window.innerHeight;
  var dpr = Math.min(window.devicePixelRatio||1, quality===2?2:1.25);
  var maxW = quality===2?1680:(quality===1?1180:820);
  var nW = Math.round(Math.min(cw*dpr, maxW));
  if(!isFinite(nW) || nW < 64) nW = 960;
  var nH = Math.round(nW*ch/cw);
  if(!isFinite(nH) || nH < 64) nH = Math.round(nW*0.62);
  if(nW===W && nH===H && grain) return;      // ignora resize sem mudança real de tamanho
  W=nW; H=nH;
  view.width=W; view.height=H;
  scene.width=W; scene.height=H;
  EW=Math.ceil(W/2); EH=Math.ceil(H/2); emis.width=EW; emis.height=EH;
  BW=Math.ceil(W/9); BH=Math.ceil(H/9); bloom.width=BW; bloom.height=BH;
  CW=Math.ceil(W/2); CH=Math.ceil(H/2);
  caR.width=CW; caR.height=CH; caC.width=CW; caC.height=CH;
  buildOverlays();
  updateCameraRig();
}

/* texturas de pós-processamento */
function buildOverlays(){
  // grão de filme
  grain = cv(160,160);
  var g=grain.getContext('2d'), id=g.createImageData(160,160), d=id.data;
  for(var i=0;i<d.length;i+=4){ var n=200+Math.random()*55|0; d[i]=d[i+1]=d[i+2]=n; d[i+3]=26; }
  g.putImageData(id,0,0);
  // scanlines
  scan = cv(2,4);
  var s=scan.getContext('2d');
  s.fillStyle='rgba(0,0,0,0.30)'; s.fillRect(0,0,2,2);
  s.fillStyle='rgba(0,0,0,0.00)'; s.fillRect(0,2,2,2);
  // vinheta
  vign = cv(Math.max(2,W>>1), Math.max(2,H>>1));
  var v=vign.getContext('2d');
  var vg=v.createRadialGradient(vign.width/2,vign.height/2,vign.height*0.18,
                                vign.width/2,vign.height/2,vign.height*0.82);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(0.62,'rgba(10,0,20,0.12)');
  vg.addColorStop(1,'rgba(6,0,14,0.78)');
  v.fillStyle=vg; v.fillRect(0,0,vign.width,vign.height);
}

/* ---------- paletas do ciclo dia/noite ---------- */
var PALETTES = [
 { name:'HORA DOURADA',
   skyTop:'#3a1163', skyMid:'#8e2b7e', skyLow:'#ff5f6d', horizon:'#ffc16b',
   sun1:'#fff7a8', sun2:'#ff2f87', mount1:'#2e1149', mount2:'#4d1c63', mount3:'#6b2a72',
   g1:'#1c1136', g2:'#241645', road1:'#191325', road2:'#1f1930',
   rumble1:'#ff2f87', rumble2:'#ffe066', lane:'#ffeaf5', neon:'#ff2f87', fog:'#8e2b7e', star:0 },
 { name:'CREPÚSCULO',
   skyTop:'#160a3d', skyMid:'#3d1470', skyLow:'#a8267e', horizon:'#ff6f61',
   sun1:'#ffd166', sun2:'#e01a72', mount1:'#1b0c39', mount2:'#2d1252', mount3:'#421a63',
   g1:'#120a2a', g2:'#180f36', road1:'#130f20', road2:'#171326',
   rumble1:'#00e5ff', rumble2:'#ff2f87', lane:'#dff8ff', neon:'#00e5ff', fog:'#3d1470', star:0.45 },
 { name:'MEIA-NOITE',
   skyTop:'#03030f', skyMid:'#0a0a2b', skyLow:'#161a55', horizon:'#3b2a8c',
   sun1:'#9ad8ff', sun2:'#4a3aa8', mount1:'#070722', mount2:'#0d0d33', mount3:'#141446',
   g1:'#07061a', g2:'#0b0a24', road1:'#0c0b16', road2:'#100e1c',
   rumble1:'#7b2fff', rumble2:'#00e5ff', lane:'#cfe6ff', neon:'#7b2fff', fog:'#0a0a2b', star:1 },
 { name:'AMANHECER',
   skyTop:'#0e2050', skyMid:'#3f5aa8', skyLow:'#ff9d7a', horizon:'#ffd9a0',
   sun1:'#fffbe0', sun2:'#ff8a5c', mount1:'#1a2350', mount2:'#2b3468', mount3:'#3f4a86',
   g1:'#152040', g2:'#1b284d', road1:'#161824', road2:'#1b1e2c',
   rumble1:'#ffe066', rumble2:'#ff5f6d', lane:'#ffffff', neon:'#ffb36b', fog:'#3f5aa8', star:0.25 }
];
var PKEYS = ['skyTop','skyMid','skyLow','horizon','sun1','sun2','mount1','mount2','mount3',
             'g1','g2','road1','road2','rumble1','rumble2','lane','neon','fog'];
for(var pi=0;pi<PALETTES.length;pi++){
  PALETTES[pi]._={};
  for(var pk=0;pk<PKEYS.length;pk++) PALETTES[pi]._[PKEYS[pk]] = hexRgb(PALETTES[pi][PKEYS[pk]]);
}
var pal = {};
function updatePalette(phase){
  var t = phase*PALETTES.length;
  var i = Math.floor(t)%PALETTES.length, j=(i+1)%PALETTES.length, f=t-Math.floor(t);
  f = f*f*(3-2*f);
  var A=PALETTES[i], B=PALETTES[j];
  for(var k=0;k<PKEYS.length;k++) pal[PKEYS[k]] = mixRgb(A._[PKEYS[k]], B._[PKEYS[k]], f);
  pal.star = lerp(A.star,B.star,f);
  pal.name = f<0.5?A.name:B.name;
}


/* ---------- mini-renderizador 3D: modela e ilumina os carros na inicialização ---------- */
function Mesh(){ this.v=[]; this.f=[]; }
Mesh.prototype.vert=function(x,y,z){ this.v.push([x,y,z]); return this.v.length-1; };
Mesh.prototype.quad=function(a,b,c,d,m){ this.f.push({i:[a,b,c,d],m:m}); };
Mesh.prototype.poly=function(idx,m){ this.f.push({i:idx,m:m}); };

function M(col,spec,shin,rim,emis){
  return {col:col, spec:(spec===undefined?0.5:spec), shin:(shin||24),
          rim:(rim===undefined?0.6:rim), emis:!!emis};
}

/* ambiente de luz: sol quente à frente-esquerda, céu violeta acima, contraluz magenta */
var ENV=(function(){
  var L=[-0.40,0.66,0.64], n=Math.sqrt(L[0]*L[0]+L[1]*L[1]+L[2]*L[2]);
  return { L:[L[0]/n,L[1]/n,L[2]/n],
           amb:[0.14,0.11,0.19], sky:[0.34,0.24,0.52], gnd:[0.07,0.03,0.10],
           key:[0.92,0.82,0.70], spc:[1.00,0.93,0.98], rimc:[255,95,195] };
})();

function shadeCol(n,mat){
  var nd=Math.max(0,n[0]*ENV.L[0]+n[1]*ENV.L[1]+n[2]*ENV.L[2]);
  var hemi=0.5+0.5*n[1];
  var rimF=Math.pow(1-Math.abs(n[2]),3.2)*mat.rim;
  var hx=ENV.L[0], hy=ENV.L[1], hz=ENV.L[2]-1;
  var hl=Math.sqrt(hx*hx+hy*hy+hz*hz)||1;
  var sd=Math.max(0,(n[0]*hx+n[1]*hy+n[2]*hz)/hl);
  var spf=Math.pow(sd,mat.shin)*mat.spec;
  var o=[0,0,0];
  for(var i=0;i<3;i++){
    o[i]=clamp(mat.col[i]*(ENV.amb[i]+hemi*ENV.sky[i]+(1-hemi)*ENV.gnd[i]+nd*ENV.key[i])
               + spf*225*ENV.spc[i] + rimF*ENV.rimc[i]*0.5, 0, 255);
  }
  return o;
}

/* seção transversal em superelipse — dá o arredondado de carroceria */
function sectionPts(hw,yb,yt,n,pw,ph){
  var cy=(yb+yt)*0.5, hh=(yt-yb)*0.5, pts=[], i;
  for(i=0;i<n;i++){
    var t=(i/n)*PI*2, c=Math.cos(t), sn=Math.sin(t);
    pts.push([ (c<0?-1:1)*Math.pow(Math.abs(c),2/pw)*hw,
               cy+(sn<0?-1:1)*Math.pow(Math.abs(sn),2/ph)*hh ]);
  }
  return pts;
}
function resample(secs,count){
  var out=[],n=secs.length,i,c;
  for(i=0;i<count;i++){
    var t=i/(count-1)*(n-1), k=Math.min(n-2,Math.floor(t)), f=t-k;
    var p0=secs[Math.max(0,k-1)],p1=secs[k],p2=secs[k+1],p3=secs[Math.min(n-1,k+2)];
    var f2=f*f,f3=f2*f,row=[0,0,0,0];
    for(c=0;c<4;c++){
      var m0=(p2[c]-p0[c])*0.5, m1=(p3[c]-p1[c])*0.5;
      row[c]=(2*f3-3*f2+1)*p1[c]+(f3-2*f2+f)*m0+(-2*f3+3*f2)*p2[c]+(f3-f2)*m1;
    }
    out.push(row);
  }
  return out;
}
function loft(mesh,secs,n,pw,ph,mat,capA,capB){
  var rings=[],i,k;
  for(i=0;i<secs.length;i++){
    var pts=sectionPts(secs[i][1],secs[i][2],secs[i][3],n,pw,ph), r=[];
    for(k=0;k<n;k++) r.push(mesh.vert(pts[k][0],pts[k][1],secs[i][0]));
    rings.push(r);
  }
  for(i=0;i<rings.length-1;i++)
    for(k=0;k<n;k++)
      mesh.quad(rings[i][k],rings[i][(k+1)%n],rings[i+1][(k+1)%n],rings[i+1][k],mat);
  if(capA) mesh.poly(rings[0].slice(),mat);
  if(capB) mesh.poly(rings[rings.length-1].slice(),mat);
  return rings;
}
function box(mesh,x0,x1,y0,y1,z0,z1,mat){
  var v=[mesh.vert(x0,y0,z0),mesh.vert(x1,y0,z0),mesh.vert(x1,y1,z0),mesh.vert(x0,y1,z0),
         mesh.vert(x0,y0,z1),mesh.vert(x1,y0,z1),mesh.vert(x1,y1,z1),mesh.vert(x0,y1,z1)];
  mesh.quad(v[0],v[1],v[2],v[3],mat); mesh.quad(v[5],v[4],v[7],v[6],mat);
  mesh.quad(v[4],v[0],v[3],v[7],mat); mesh.quad(v[1],v[5],v[6],v[2],mat);
  mesh.quad(v[3],v[2],v[6],v[7],mat); mesh.quad(v[4],v[5],v[1],v[0],mat);
}
function wheel(mesh,cx,cz,r,hw,matA,matB,matRim){
  var n=16,A=[],B=[],C=[],i,a;
  for(i=0;i<n;i++){
    a=i/n*PI*2;
    A.push(mesh.vert(cx-hw, r+Math.sin(a)*r, cz+Math.cos(a)*r));
    B.push(mesh.vert(cx+hw, r+Math.sin(a)*r, cz+Math.cos(a)*r));
    C.push(mesh.vert(cx+hw*1.02, r+Math.sin(a)*r*0.60, cz+Math.cos(a)*r*0.60));
  }
  for(i=0;i<n;i++) mesh.quad(A[i],A[(i+1)%n],B[(i+1)%n],B[i], (i%2)?matA:matB);
  mesh.poly(A.slice(),matA); mesh.poly(B.slice(),matA); mesh.poly(C.slice(),matRim);
}

/* ponteira de escape: cilindro curto com boca escura */
function tube(mesh,cx,cy,z0,z1,r,matOut,matIn){
  var n=10,A=[],B=[],i,a;
  for(i=0;i<n;i++){ a=i/n*PI*2;
    A.push(mesh.vert(cx+Math.cos(a)*r, cy+Math.sin(a)*r, z1));
    B.push(mesh.vert(cx+Math.cos(a)*r*0.74, cy+Math.sin(a)*r*0.74, z0));

  for(i=0;i<n;i++) mesh.quad(A[i],A[(i+1)%n],B[(i+1)%n],B[i],matOut);
  mesh.poly(B.slice(),matIn);
}

function buildCar(bodyCol,accent,style){

  var dark=M([40,32,60],0.35,16,0.45), slot=M([12,9,22],0.15,10,0.30);
  var tire=M([17,14,28],0.18,10,0.35), tread=M([9,7,16],0.12,8,0.28);

  var light=M(accent,0.6,20,0.4,true), plate=M([214,211,228],0.4,18,0.30);

    var stripe=M([238,238,248],0.9,36,0.8);
    for(i=f0;i<m.f.length;i++){
      var fc=m.f[i], sx=0, sy=0, cn=fc.i.length, q;
      for(q=0;q<cn;q++){ sx+=m.v[fc.i[q]][0]; sy+=m.v[fc.i[q]][1]; }
      if(Math.abs(sx/cn)<0.145 && sy/cn>0.80) fc.m=stripe;

  var wr = sport?0.38:0.36, ww = sport?0.17:0.15, wx = sport?0.90:0.84;

  box(m,-0.78,0.78, 0.26,0.44, zr-0.02,zr+0.30, dark);
  box(m,-0.17,0.17, 0.30,0.42, zr-0.035,zr-0.015, plate);
  tube(m,-0.36,0.32, zr+0.02,zr-0.07, 0.105, chrome, slot);
  tube(m, 0.36,0.32, zr+0.02,zr-0.07, 0.105, chrome, slot);

  /* difusor com canaletas escuras */
  box(m,-0.70,0.70, 0.13,0.28, zr-0.01,zr+0.42, dark);
  for(i=0;i<6;i++){
    var fx=-0.58+i*0.225;
    box(m,fx,fx+0.075, 0.14,0.26, zr-0.03,zr-0.005, slot);
  }
  if(sport){
    /* asa: plataforma baixa sobre o capô traseiro, com fita de neon */
    box(m,-0.30,-0.22, top+0.02,top+0.16, zr+0.12,zr+0.26, dark);
    box(m, 0.22, 0.30, top+0.02,top+0.16, zr+0.12,zr+0.26, dark);
    box(m,-0.99,0.99, top+0.15,top+0.20, zr-0.04,zr+0.34, dark);
    box(m,-0.99,0.99, top+0.122,top+0.152, zr-0.05,zr+0.35, neon);
    box(m,-1.03,-0.97, top-0.02,top+0.30, zr-0.08,zr+0.38, dark);
    box(m, 0.97, 1.03, top-0.02,top+0.30, zr-0.08,zr+0.38, dark);
    /* tomadas de ar laterais */
    box(m,-1.02,-0.97, 0.46,0.68, -0.35,0.50, slot);
    box(m, 0.97, 1.02, 0.46,0.68, -0.35,0.50, slot);
  } else {
    box(m,-0.66,0.66, top+0.01,top+0.05, zr+0.04,zr+0.32, dark);
  }

}

function buildTruck(){
  var m=new Mesh(), i;
  var body=M([206,210,226],0.55,22,0.7), panel=M([170,175,196],0.5,20,0.6);
  var dark=M([28,24,46],0.3,14,0.45), glass=M([32,28,58],1.0,60,1.0);
  var light=M([255,59,92],0.6,20,0.4,true);

  var rim=M([128,126,158],0.9,40,0.8);
  box(m,-1.22,1.22, 0.66,2.62, -2.60,1.10, body);          // baú
  for(i=0;i<3;i++) box(m,-1.24,1.24, 0.90+i*0.60,0.96+i*0.60, -2.63,1.12, panel);

}

/* projeção + rasterização por pintor, com normais viradas para a câmera */
var CAM_H=1.34, CAM_D=8.6, FOCAL=1000;
function projectAll(mesh,yaw){
  var cy=Math.cos(yaw), sy=Math.sin(yaw), P=[], Q=[], i;
  for(i=0;i<mesh.v.length;i++){
    var p=mesh.v[i];
    var x=p[0]*cy+p[2]*sy, z=-p[0]*sy+p[2]*cy, y=p[1];
    Q.push([x,y,z]);
    var zc=z+CAM_D, iz=FOCAL/Math.max(zc,0.05);
    P.push([x*iz, -(y-CAM_H)*iz, zc]);
  }
  return {P:P,Q:Q};
}
function computeFit(mesh,cw,ch){
  var pr=projectAll(mesh,0), P=pr.P, i;
  var mnx=1e9,mxx=-1e9,mny=1e9,mxy=-1e9;
  for(i=0;i<P.length;i++){
    if(P[i][0]<mnx)mnx=P[i][0]; if(P[i][0]>mxx)mxx=P[i][0];
    if(P[i][1]<mny)mny=P[i][1]; if(P[i][1]>mxy)mxy=P[i][1];
  }
  var s=Math.min(cw*0.95/Math.max(mxx-mnx,1e-6), ch*0.86/Math.max(mxy-mny,1e-6));
  return { s:s, ox:cw/2-(mnx+mxx)/2*s, oy:ch*0.962-mxy*s };
}
function renderMesh(mesh,cw,ch,yaw,fit){
  var base=cv(cw,ch), g=base.getContext('2d');
  var glowC=cv(cw,ch), e=glowC.getContext('2d');
  var pr=projectAll(mesh,yaw), P=pr.P, Q=pr.Q, i,k;

  g.fillStyle='rgba(0,0,0,0.50)';
  g.beginPath(); g.ellipse(cw*0.5,ch*0.955,cw*0.44,ch*0.038,0,0,PI*2); g.fill();

  /* passe de silhueta: preenche a área toda opaca ANTES do sombreamento,
     senão as arestas antialiasadas entre faces deixam o carro translúcido */
  var order=[];
  for(i=0;i<mesh.f.length;i++){
    var f=mesh.f[i], d=0;
    for(k=0;k<f.i.length;k++) d+=P[f.i[k]][2];
    order.push({f:f, d:d/f.i.length});
  }
  order.sort(function(a,b){ return b.d-a.d; });

  g.fillStyle='#120e20'; g.strokeStyle='#120e20'; g.lineWidth=2.6;
  for(i=0;i<order.length;i++){
    var sil=order[i].f.i;
    g.beginPath();
    for(k=0;k<sil.length;k++){
      var qx0=P[sil[k]][0]*fit.s+fit.ox, qy0=P[sil[k]][1]*fit.s+fit.oy;
      if(k===0) g.moveTo(qx0,qy0); else g.lineTo(qx0,qy0);
    }
    g.closePath(); g.fill(); g.stroke();
  }

  for(i=0;i<order.length;i++){
    var fc=order[i].f, idx=fc.i, mat=fc.m;
    var a=Q[idx[0]], b=Q[idx[1]], c=Q[idx[2]];
    var ux=b[0]-a[0], uy=b[1]-a[1], uz=b[2]-a[2];
    var vx=c[0]-a[0], vy=c[1]-a[1], vz=c[2]-a[2];
    var nx=uy*vz-uz*vy, ny=uz*vx-ux*vz, nz=ux*vy-uy*vx;
    var nl=Math.sqrt(nx*nx+ny*ny+nz*nz); if(nl<1e-9) continue;
    nx/=nl; ny/=nl; nz/=nl;
    var ccx=0,ccy=0,ccz=0;
    for(k=0;k<idx.length;k++){ ccx+=Q[idx[k]][0]; ccy+=Q[idx[k]][1]; ccz+=Q[idx[k]][2]; }
    ccx/=idx.length; ccy/=idx.length; ccz/=idx.length;
    var vwx=-ccx, vwy=CAM_H-ccy, vwz=-CAM_D-ccz;
    if(nx*vwx+ny*vwy+nz*vwz < 0){ nx=-nx; ny=-ny; nz=-nz; }

    var col = mat.emis ? mat.col : shadeCol([nx,ny,nz],mat);
    var st='rgb('+(col[0]|0)+','+(col[1]|0)+','+(col[2]|0)+')';
    g.fillStyle=st; g.strokeStyle=st; g.lineWidth=2;
    g.beginPath();
    for(k=0;k<idx.length;k++){
      var px=P[idx[k]][0]*fit.s+fit.ox, py=P[idx[k]][1]*fit.s+fit.oy;
      if(k===0) g.moveTo(px,py); else g.lineTo(px,py);
    }
    g.closePath(); g.fill(); g.stroke();

    if(mat.emis){
      e.fillStyle=st; e.strokeStyle=st; e.lineWidth=1;
      e.beginPath();
      for(k=0;k<idx.length;k++){
        var qx=P[idx[k]][0]*fit.s+fit.ox, qy=P[idx[k]][1]*fit.s+fit.oy;
        if(k===0) e.moveTo(qx,qy); else e.lineTo(qx,qy);
      }
      e.closePath(); e.fill(); e.stroke();
    }
  }
  return {img:base, glow:glowC};
}
function carSprites(mesh,cw,ch,worldW,yaws){
  var fit=computeFit(mesh,cw,ch), out=[], i;
  for(i=0;i<yaws.length;i++){
    var r=renderMesh(mesh,cw,ch,yaws[i],fit);
    out.push({img:r.img, glow:r.glow, w:cw, h:ch, worldW:worldW});
  }
  return out;
}

/* ---------- sprites pré-renderizados ---------- */
var SPR = {};
function makeSprite(w,h,worldW,drawBase,drawGlow){
  var base=cv(w,h); drawBase(base.getContext('2d'),w,h);
  var glow=null;
  if(drawGlow){ glow=cv(w,h); drawGlow(glow.getContext('2d'),w,h); }
  return { img:base, glow:glow, w:w, h:h, worldW:worldW };
}

function buildSprites(){
  var i,k;
  function bez(A,B,C,t){ var u=1-t;
    return [u*u*A[0]+2*u*t*B[0]+t*t*C[0], u*u*A[1]+2*u*t*B[1]+t*t*C[1]]; }

  /* ── palmeiras: tronco segmentado, folíolos individuais, cocos, contraluz ── */
  function palmSprite(seed){
    return makeSprite(340,640,1400,function(g,w,h){
      var lean=((seed%3)-1)*0.17, j;
      var base=[w*0.54,h], mid=[w*(0.52+lean*0.45),h*0.62], top=[w*(0.50+lean*0.95),h*0.325];
      var pts=[];
      for(j=0;j<=28;j++){
        var t=j/28, q=bez(base,mid,top,t);
        pts.push([q[0],q[1],lerp(w*0.062,w*0.024,t)*(1+0.09*Math.sin(t*26))]);
      }
      for(j=1;j<pts.length;j++){
        var A2=pts[j-1], B2=pts[j];
        g.fillStyle=(j%2)?'#241634':'#180d28';
        g.beginPath(); g.moveTo(A2[0]-A2[2],A2[1]); g.lineTo(A2[0]+A2[2],A2[1]);
        g.lineTo(B2[0]+B2[2],B2[1]); g.lineTo(B2[0]-B2[2],B2[1]); g.closePath(); g.fill();
        g.fillStyle='rgba(255,120,200,0.26)';
        g.fillRect(B2[0]+B2[2]-w*0.011,B2[1],w*0.011,A2[1]-B2[1]+1);
      }
      var bx=top[0], by=top[1], nf=10+(seed%3);
      for(var f=0;f<nf;f++){
        var a0=-PI*0.5+(f-(nf-1)/2)*(PI*1.06/nf)+(seed%2?0.06:-0.06);
        var L=h*0.30*(0.74+0.32*Math.cos((f-(nf-1)/2)*0.38));
        var A3=[bx,by];
        var B3=[bx+Math.cos(a0)*L*0.56, by+Math.sin(a0)*L*0.44];
        var C3=[bx+Math.cos(a0)*L*1.04, by+Math.sin(a0)*L*0.70+L*0.50];
        var up=[], dn=[], spine=[];
        for(k=0;k<=12;k++){
          var tt=k/12, q1=bez(A3,B3,C3,tt), q2=bez(A3,B3,C3,Math.min(1,tt+0.02));
          var dx=q2[0]-q1[0], dy=q2[1]-q1[1], dl=Math.sqrt(dx*dx+dy*dy)||1;
          var nx=-dy/dl, ny=dx/dl;
          var ww=L*0.27*Math.sin(tt*PI)*(1-tt*0.22)+w*0.010;
          spine.push(q1);
          up.push([q1[0]+nx*ww, q1[1]+ny*ww]);
          dn.push([q1[0]-nx*ww, q1[1]-ny*ww]);
        }
        g.fillStyle=(f%2)?'#1d1130':'#170c28';
        g.beginPath(); g.moveTo(up[0][0],up[0][1]);
        for(k=1;k<up.length;k++) g.lineTo(up[k][0],up[k][1]);
        for(k=dn.length-1;k>=0;k--) g.lineTo(dn[k][0],dn[k][1]);
        g.closePath(); g.fill();
        g.strokeStyle='rgba(5,2,10,0.85)'; g.lineWidth=1.7;
        for(k=2;k<up.length;k++){
          g.beginPath(); g.moveTo(up[k][0],up[k][1]); g.lineTo(spine[k-1][0],spine[k-1][1]); g.stroke();
          g.beginPath(); g.moveTo(dn[k][0],dn[k][1]); g.lineTo(spine[k-1][0],spine[k-1][1]); g.stroke();
        }
        g.strokeStyle='rgba(255,130,208,0.34)'; g.lineWidth=2.6;
        g.beginPath(); g.moveTo(up[0][0],up[0][1]);
        for(k=1;k<up.length;k++) g.lineTo(up[k][0],up[k][1]); g.stroke();
        g.strokeStyle='#0d0619'; g.lineWidth=2.8;
        g.beginPath(); g.moveTo(A3[0],A3[1]); g.quadraticCurveTo(B3[0],B3[1],C3[0],C3[1]); g.stroke();
      }
      g.fillStyle='#0f0820';
      for(j=0;j<5;j++){ g.beginPath();
        g.arc(bx+Math.cos(j*1.3)*w*0.040, by+h*0.020+Math.sin(j*1.3)*h*0.012, w*0.023,0,PI*2); g.fill(); }
    });
  }
  SPR.palms=[palmSprite(0),palmSprite(1),palmSprite(2)];

function lastY(){ return segments.length===0?0:segments[segments.length-1].p2.world.y; }

function addSegment(curve,y){
  var n=segments.length;
  segments.push({
    index:n,
    p1:{ world:{y:lastY(), z:n*SEGLEN},      camera:{}, screen:{} },
    p2:{ world:{y:y,      z:(n+1)*SEGLEN},   camera:{}, screen:{} },
    curve:curve, sprites:[], cars:[], looped:false, clip:0, biome:0,
    color:(Math.floor(n/RUMBLE)%2)?1:0
  });
}
function addRoad(enter,hold,leave,curve,y){
  var startY=lastY(), endY=startY+(y||0)*SEGLEN, total=enter+hold+leave, n;
  for(n=0;n<enter;n++) addSegment(easeIn(0,curve,n/enter), easeInOut(startY,endY,n/total));
  for(n=0;n<hold;n++)  addSegment(curve, easeInOut(startY,endY,(enter+n)/total));
  for(n=0;n<leave;n++) addSegment(easeInOut(curve,0,n/leave), easeInOut(startY,endY,(enter+hold+n)/total));
}

var traffic=[];
function placeTraffic(){
  traffic=[];
  var count = DF().cars;
  for(var i=0;i<count;i++){
    var isTruck = Math.random()<0.18;
    var lane = randi(0,LANES-1);
    var ln=(lane-1)*0.62 + rand(-0.07,0.07);
    traffic.push({
      offset:ln, lane:ln, laneT:rand(5,20),
      z: Math.floor(Math.random()*segments.length)*SEGLEN,
      sprite: isTruck?SPR.truck:pick(SPR.cars),
      speed: isTruck?rand(DF().tmin*0.62,DF().tmin*0.84):rand(DF().tmin,DF().tmax),
      target: 0, seg:null, hit:0
    });
  }
  syncTraffic();
}
function syncTraffic(){
  var n; for(n=0;n<segments.length;n++) segments[n].cars.length=0;
  for(n=0;n<traffic.length;n++){
    var c=traffic[n];
    c.seg = findSegment(c.z);
    c.seg.cars.push(c);
  }
}

function updateCameraRig(){
  var vw=(numP===2 && H<W*0.8)?W/2:W, vh=(numP===2 && H>=W*0.8)?H/2:H;
  var ar=vh/Math.max(vw,1);

  // altura e distância eram um valor só: subir a câmera empurrava ela para trás
  // na mesma proporção. Separados, dá para recuar pouco e inclinar o olhar para baixo.
  camHeight = (camMode?900:2160)*pull;
  camDist   = (camMode?740:1800)*pull;
  // Só aumentar a altura não sobe a câmera: o horizonte fica cravado no meio da
  // tela, então o ponto onde a pista encosta no carro escorrega para fora por
  // baixo e o carro passa a flutuar. camPitch desce a linha do horizonte junto,
  // que é o que inclinar a câmera para baixo realmente faz.
  camPitch  = camMode?0:0.150;
  COCK=null;
}

function padVal(gp,b){
  if(b.t==='b'){
    var bt=gp.buttons&&gp.buttons[b.i];
    if(bt===undefined||bt===null) return 0;
    if(typeof bt==='object') return (typeof bt.value==='number')?bt.value:(bt.pressed?1:0);
    return bt?1:0;
  }
  var v=gp.axes&&gp.axes[b.i];
  if(typeof v!=='number') return 0;
  v*=(b.d||1);
  return v>0.22 ? Math.min(1,(v-0.22)/0.62) : 0;
}
function actVal(gp,k){
  var arr=padMap[k], m=0, j;

  for(j=0;j<arr.length;j++){ var v=padVal(gp,arr[j]); if(v>m) m=v; }

}

   um controle. A âncora é o id do controle, não o índice, porque o navegador
   renumera os índices quando um controle desconecta e reconecta. */
var padAssign=[null,null], padAssignId=['',''], padActive=-1;
function saveAssign(){
  try{ localStorage.setItem('nd_padassign', JSON.stringify({a:padAssign,d:padAssignId})); }catch(e){}
}
function loadAssign(){
  try{
    var raw=localStorage.getItem('nd_padassign'); if(!raw) return;
    var o=JSON.parse(raw);
    if(o && o.a && o.a.length===2){
      padAssign=[ (typeof o.a[0]==='number')?o.a[0]:null, (typeof o.a[1]==='number')?o.a[1]:null ];
      padAssignId=[ String((o.d&&o.d[0])||''), String((o.d&&o.d[1])||'') ];
    }
  }catch(e){ padAssign=[null,null]; padAssignId=['','']; }
}
function rawPads(){
  if(!gamepadOK || !navigator.getGamepads) return [];
  var gps; try{ gps=navigator.getGamepads(); }catch(e){ gamepadOK=false; return []; }
  return gps||[];
}
function padList(){
  var gps=rawPads(), out=[], i;
  for(i=0;i<gps.length;i++) if(gps[i]) out.push(gps[i]);
  return out;
}
/* religa a escolha quando os índices mudam mas o mesmo controle continua lá */
function reanchorAssign(list){
  var i,j,k;
  for(i=0;i<2;i++){
    if(padAssign[i]===null || !padAssignId[i]) continue;
    var stillThere=false;
    for(j=0;j<list.length;j++) if(list[j].index===padAssign[i]) stillThere=true;
    if(stillThere) continue;
    for(j=0;j<list.length;j++){
      if(String(list[j].id)!==padAssignId[i]) continue;
      var taken=false;
      for(k=0;k<2;k++) if(k!==i && padAssign[k]===list[j].index) taken=true;
      if(!taken){ padAssign[i]=list[j].index; break; }
    }
  }
}
function padForSlot(slot){
  var list=padList(), i, j;
  if(!list.length) return null;
  reanchorAssign(list);
  if(padAssign[slot]!==null){
    for(i=0;i<list.length;i++) if(list[i].index===padAssign[slot]) return list[i];
    return null;                       // o controle fixado sumiu: não rouba o do outro
  }
  // automático: pega o n-ésimo controle que ninguém fixou
  var rank=0;
  for(i=0;i<slot;i++) if(padAssign[i]===null) rank++;
  for(i=0;i<list.length;i++){
    var claimed=false;
    for(j=0;j<2;j++) if(padAssign[j]!==null && padAssign[j]===list[i].index) claimed=true;
    if(claimed) continue;
    if(rank===0) return list[i];
    rank--;
  }
  return null;
}
function setPadAssign(slot,val){
  var i;
  if(val!==null) for(i=0;i<2;i++) if(i!==slot && padAssign[i]===val) padAssign[i]=null;
  padAssign[slot]=val;
  padAssignId[slot]='';
  if(val!==null){
    var list=padList();
    for(i=0;i<list.length;i++) if(list[i].index===val) padAssignId[slot]=String(list[i].id);
  }
  saveAssign();
}
/* qual controle está sendo mexido agora — só para marcar na tela de escolha */
function pollPadActivity(){
  var list=padList(), i, j, v, bt, best=-1;
  for(i=0;i<list.length && best<0;i++){
    var gp=list[i];
    if(gp.buttons) for(j=0;j<gp.buttons.length;j++){
      bt=gp.buttons[j];
      v=(bt&&typeof bt==='object')?(typeof bt.value==='number'?bt.value:(bt.pressed?1:0)):(bt?1:0);
      if(v>0.5){ best=gp.index; break; }
    }
    if(best<0 && gp.axes) for(j=0;j<gp.axes.length;j++){
      v=gp.axes[j];
      if(typeof v==='number' && Math.abs(v)>0.6){ best=gp.index; break; }
    }
  }
  if(best!==padActive){ padActive=best; return true; }
  return false;
}
function firstPad(){
  if(!gamepadOK || !navigator.getGamepads) return null;
  var gps; try{ gps=navigator.getGamepads(); }catch(e){ gamepadOK=false; return null; }
  if(!gps) return null;
  for(var i=0;i<gps.length;i++) if(gps[i]) return gps[i];
  return null;
}

function onKey(e,down){
  var k=e.key, K0=keys[0], K1=keys[1], alt=(numP===2?K1:K0);
  if(k==='ArrowLeft'){ K0.left=down; e.preventDefault(); }
  else if(k==='ArrowRight'){ K0.right=down; e.preventDefault(); }
  else if(k==='ArrowUp'){ K0.gas=down; e.preventDefault(); }
  else if(k==='ArrowDown'){ K0.brake=down; e.preventDefault(); }
  else if(k===' '){ K0.nitro=down; e.preventDefault(); }
  else if(k==='Shift'){ K0.drift=down; }
  else if(k==='a'||k==='A'){ alt.left=down; }
  else if(k==='d'||k==='D'){ alt.right=down; }
  else if(k==='w'||k==='W'){ alt.gas=down; }
  else if(k==='s'||k==='S'){ alt.brake=down; }
  else if(k==='f'||k==='F'){ K1.nitro=down; }
  else if(k==='g'||k==='G'){ K1.drift=down; }
  if(!down) return;
  if(k==='p'||k==='P'){ togglePause(); }
  else if(k==='m'||k==='M'){ toggleMute(); }
  else if(k==='q'||k==='Q'){ cycleQuality(); }
  else if(k==='c'||k==='C'){ toggleCam(); }
  else if(state==='menu' && (k==='Enter'||k===' ')){ startRun(); }
  else if(state==='over' && (k==='Enter'||k===' ')){ startRun(); }
}
window.addEventListener('keydown',function(e){onKey(e,true);},{passive:false});
window.addEventListener('keyup',function(e){onKey(e,false);},{passive:false});

function bindPad(id,prop,setIdx){

  function on(e){ padSet(setIdx||0)[prop]=true; e.preventDefault(); }
  function off(e){ padSet(setIdx||0)[prop]=false; e.preventDefault(); }
  el.addEventListener('pointerdown',on);
  el.addEventListener('pointerup',off);
  el.addEventListener('pointercancel',off);
  el.addEventListener('pointerleave',off);
}

var gamepadOK = true;
function readGamepad(slot){
  if(!gamepadOK || !navigator.getGamepads || capturing) return;
  var gps;
  try { gps = navigator.getGamepads(); }
  catch(e){ gamepadOK = false; return; }
  if(!gps) return;
  var gp=padForSlot(slot||0);
  if(gp){
    var g=actVal(gp,'gas'), b=actVal(gp,'brake');
    if(g>0.06){ ctrl.gas=true;   if(g>ctrl.gasA)   ctrl.gasA=g; }      // gatilho analógico
    if(b>0.06){ ctrl.brake=true; if(b>ctrl.brakeA) ctrl.brakeA=b; }
    if(actVal(gp,'left')  > 0.30) ctrl.left=true;
    if(actVal(gp,'right') > 0.30) ctrl.right=true;
    if(actVal(gp,'nitro') > 0.50) ctrl.nitro=true;
    if(actVal(gp,'drift') > 0.50) ctrl.drift=true;
  }
}
/* botão de pausa/início do controle, válido em qualquer estado */
function pollPadSystem(){
  if(capturing) return;
  // qualquer controle conectado inicia e pausa, atribuído ou não. Amarrar isso à
  // atribuição fazia o menu ignorar justamente o controle que a pessoa aperta.
  var pressed=false, list=padList(), i;
  for(i=0;i<list.length;i++) if(actVal(list[i],'pause')>0.5){ pressed=true; break; }
  if(pressed && !padSysLatch){
    padSysLatch=1;
    if(state==='play'||state==='paused') togglePause();
    else if(state==='menu'||state==='over') startRun();
  } else if(!pressed) padSysLatch=0;
}
/* captura de um novo botão. Qualquer entrada já ativa quando a captura abre fica
   bloqueada até ser solta — senão um gatilho segurado se auto-atribuiria. */
function pollCapture(){
  if(!capturing) return;
  var gp=firstPad(); if(!gp) return;
  if(!captureBlock) captureBlock={b:{},a:{}};
  var i, v, bt;
  if(gp.buttons) for(i=0;i<gp.buttons.length;i++){
    bt=gp.buttons[i];
    v=(bt&&typeof bt==='object')?(typeof bt.value==='number'?bt.value:(bt.pressed?1:0)):(bt?1:0);
    if(captureBlock.b[i]===undefined) captureBlock.b[i]=(v>0.30);
    if(captureBlock.b[i]){ if(v<0.25) captureBlock.b[i]=false; continue; }
    if(v>0.65){ assignBind({t:'b',i:i}); return; }
  }
  if(gp.axes) for(i=0;i<gp.axes.length;i++){
    v=gp.axes[i]; if(typeof v!=='number') continue;
    if(captureBlock.a[i]===undefined) captureBlock.a[i]=(Math.abs(v)>0.40);
    if(captureBlock.a[i]){ if(Math.abs(v)<0.30) captureBlock.a[i]=false; continue; }
    if(Math.abs(v)>0.72){ assignBind({t:'a',i:i,d:v>0?1:-1}); return; }
  }
}
function assignBind(b){
  padMap[capturing]=[b];
  capturing=null; saveMap(); renderBinds();
}

/* ---------- áudio procedural ---------- */
var AC=null, master=null, musicGain=null, sfxGain=null, spaceIn=null, eng=null;
var NB=null, muted=false, nextNote=0, mstep=0, lastGear=-1, shiftT=0, revSm=0.16;

function mkNoise(sec){
  var len=Math.max(64,Math.floor(AC.sampleRate*sec));
  var b=AC.createBuffer(1,len,AC.sampleRate), d=b.getChannelData(0);
  for(var i=0;i<len;i++) d[i]=Math.random()*2-1;
  return b;
}
function shaperCurve(k){
  var n=1024, c=new Float32Array(n);
  for(var i=0;i<n;i++){ var x=i*2/n-1; c[i]=(1+k)*x/(1+k*Math.abs(x)); }
  return c;
}
/* onda de pulso de escape: parciais decaindo como 1/n^0.82 — muito mais "motor" que serra pura */
function engineWave(){
  try{
    var n=22, re=new Float32Array(n), im=new Float32Array(n);
    for(var i=1;i<n;i++) im[i]=Math.pow(i,-0.82)*(0.6+0.4*Math.cos(i*1.15));
    return AC.createPeriodicWave(re,im,{disableNormalization:false});
  }catch(e){ return null; }
}
function loopNoise(buf,dest){
  var n=AC.createBufferSource(); n.buffer=buf; n.loop=true; n.connect(dest); n.start(); return n;
}

function initAudio(){
  if(AC) return;
  var Ctx=window.AudioContext||window.webkitAudioContext; if(!Ctx) return;
  AC=new Ctx();
  master=AC.createGain(); master.gain.value=muted?0:0.5; master.connect(AC.destination);
  NB={ s:mkNoise(0.06), m:mkNoise(0.30), l:mkNoise(2.0) };

  /* espaço: delay estéreo realimentado (mais barato que convolução, e dá ar) */
  spaceIn=AC.createGain();
  var dl=AC.createDelay(0.8), dr=AC.createDelay(0.8);
  var fb=AC.createGain(), damp=AC.createBiquadFilter(), wet=AC.createGain();
  dl.delayTime.value=0.21; dr.delayTime.value=0.29;
  fb.gain.value=0.34; damp.type='lowpass'; damp.frequency.value=2600; wet.gain.value=0.30;
  var mrg=AC.createChannelMerger(2);
  spaceIn.connect(dl); dl.connect(dr); dr.connect(damp); damp.connect(fb); fb.connect(dl);
  dl.connect(mrg,0,0); dr.connect(mrg,0,1); mrg.connect(wet); wet.connect(master);

  musicGain=AC.createGain(); musicGain.gain.value=0.24;
  musicGain.connect(master); musicGain.connect(spaceIn);
  sfxGain=AC.createGain(); sfxGain.gain.value=0.65; sfxGain.connect(master);

  /* ── motor ── */
  eng={};
  eng.pre=AC.createGain();   eng.pre.gain.value=0.5;
  eng.shape=AC.createWaveShaper(); eng.shape.curve=shaperCurve(3.4);
  try{ eng.shape.oversample='2x'; }catch(e){}
  eng.body=AC.createBiquadFilter(); eng.body.type='bandpass'; eng.body.frequency.value=320; eng.body.Q.value=0.9;
  eng.tone=AC.createBiquadFilter(); eng.tone.type='lowpass';  eng.tone.frequency.value=1800; eng.tone.Q.value=0.8;
  eng.out=AC.createGain(); eng.out.gain.value=0;
  eng.pre.connect(eng.shape); eng.shape.connect(eng.body); eng.body.connect(eng.tone);
  eng.tone.connect(eng.out); eng.out.connect(master);
  eng.low=AC.createGain(); eng.low.gain.value=0.55; eng.low.connect(eng.tone);

  var wave=engineWave();
  eng.o1=AC.createOscillator(); eng.o2=AC.createOscillator(); eng.sub=AC.createOscillator();
  if(wave){ eng.o1.setPeriodicWave(wave); eng.o2.setPeriodicWave(wave); }
  else { eng.o1.type='sawtooth'; eng.o2.type='sawtooth'; }
  eng.sub.type='sine'; eng.o2.detune.value=11;          // dois bancos levemente fora = batimento
  eng.o1.connect(eng.pre); eng.o2.connect(eng.pre); eng.sub.connect(eng.low);
  eng.o1.start(); eng.o2.start(); eng.sub.start();

  eng.intakeBP=AC.createBiquadFilter(); eng.intakeBP.type='bandpass'; eng.intakeBP.Q.value=1.5;
  eng.intake=AC.createGain(); eng.intake.gain.value=0;
  loopNoise(NB.l, eng.intakeBP); eng.intakeBP.connect(eng.intake); eng.intake.connect(eng.pre);

  var wf=AC.createBiquadFilter(); wf.type='bandpass'; wf.frequency.value=1500; wf.Q.value=0.5;
  eng.wind=AC.createGain(); eng.wind.gain.value=0;
  loopNoise(NB.l, wf); wf.connect(eng.wind); eng.wind.connect(master);

  eng.sqBP=AC.createBiquadFilter(); eng.sqBP.type='bandpass'; eng.sqBP.frequency.value=1700; eng.sqBP.Q.value=9;
  eng.squeal=AC.createGain(); eng.squeal.gain.value=0;
  loopNoise(NB.l, eng.sqBP); eng.sqBP.connect(eng.squeal);
  eng.squeal.connect(master); eng.squeal.connect(spaceIn);

  eng.turbo=AC.createOscillator(); eng.turbo.type='sine'; eng.turbo.frequency.value=3000;
  eng.turboG=AC.createGain(); eng.turboG.gain.value=0;
  eng.turbo.connect(eng.turboG); eng.turboG.connect(master); eng.turbo.start();

  nextNote=AC.currentTime+0.1;
}
function toggleMute(){ setMuted(!muted); }

/* rotação em seis marchas: sobe dentro da marcha e cai na troca */
function updateEngine(dt){
  if(!AC || !eng) return;
  var P0=(players&&players[0])||{speed:0,boosting:0,driftPower:0,gas:0};
  var t=AC.currentTime, sp=P0.speed/maxSpeed, G=6;
  var gi=clamp(Math.floor(sp*G),0,G-1), frac=clamp(sp*G-gi,0,1);
  if(gi!==lastGear){ if(lastGear>=0 && gi>lastGear) shiftT=0.14; lastGear=gi; }
  if(shiftT>0) shiftT-=dt;
  var idle=0.16;
  var rev = sp<0.012 ? idle+0.035*Math.sin(t*9) : idle+(1-idle)*(0.28+0.72*frac);
  if(shiftT>0) rev*=0.70;
  revSm += (rev-revSm)*Math.min(1,dt*15);
  var f=30+revSm*268, load=(P0.gas?1:0.30)+P0.boosting*0.5;
  var pz=(state==='paused')?0:1;

  eng.o1.frequency.setTargetAtTime(f, t, 0.02);
  eng.o2.frequency.setTargetAtTime(f*1.004, t, 0.02);
  eng.sub.frequency.setTargetAtTime(f*0.5, t, 0.03);
  eng.body.frequency.setTargetAtTime(f*3.2+180, t, 0.05);
  eng.body.Q.setTargetAtTime(0.8+load*1.5, t, 0.08);
  eng.tone.frequency.setTargetAtTime(480+revSm*3300*load, t, 0.05);
  eng.intakeBP.frequency.setTargetAtTime(f*5+300, t, 0.05);
  eng.intake.gain.setTargetAtTime(0.04+load*0.15*revSm, t, 0.08);
  eng.pre.gain.setTargetAtTime(0.32+load*0.46, t, 0.06);
  eng.out.gain.setTargetAtTime(pz*(0.15+revSm*0.17)*(shiftT>0?0.55:1), t, 0.05);
  eng.wind.gain.setTargetAtTime(pz*Math.max(0,sp-0.30)*0.11, t, 0.12);
  eng.squeal.gain.setTargetAtTime(pz*(P0.driftPower>0.35?(P0.driftPower-0.35)*0.30:0), t, 0.06);
  eng.sqBP.frequency.setTargetAtTime(1400+P0.driftPower*1100+sp*400, t, 0.08);
  eng.turboG.gain.setTargetAtTime(pz*P0.boosting*0.035, t, 0.10);
  eng.turbo.frequency.setTargetAtTime(2400+sp*3000+boosting*900, t, 0.08);
}

/* ── música ── */
function burst(buf,t,dur,type,freq,Q,vol){
  var n=AC.createBufferSource(); n.buffer=buf;
  var f=AC.createBiquadFilter(); f.type=type; f.frequency.value=freq; if(Q) f.Q.value=Q;
  var g=AC.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
  n.connect(f); f.connect(g); g.connect(musicGain); n.start(t); n.stop(t+dur+0.02);
}
function kick(t){
  var o=AC.createOscillator(); o.type='sine';
  o.frequency.setValueAtTime(190,t); o.frequency.exponentialRampToValueAtTime(42,t+0.09);
  var g=AC.createGain(); g.gain.setValueAtTime(0.9,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.30);
  o.connect(g); g.connect(musicGain); o.start(t); o.stop(t+0.34);
  burst(NB.s,t,0.022,'highpass',2200,0,0.26);
}
function snare(t){
  burst(NB.m,t,0.17,'bandpass',1900,0.7,0.30);
  var o=AC.createOscillator(); o.type='triangle';
  o.frequency.setValueAtTime(205,t); o.frequency.exponentialRampToValueAtTime(150,t+0.08);
  var g=AC.createGain(); g.gain.setValueAtTime(0.17,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.11);
  o.connect(g); g.connect(musicGain); o.start(t); o.stop(t+0.15);
}
function hat(t,open){ burst(open?NB.m:NB.s, t, open?0.17:0.042, 'highpass', 7200, 0, open?0.085:0.055); }
function bass(f,t,dur){
  var lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.Q.value=7;
  lp.frequency.setValueAtTime(f*9,t); lp.frequency.exponentialRampToValueAtTime(f*2.2,t+dur*0.85);
  var g=AC.createGain();
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.24,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  lp.connect(g); g.connect(musicGain);
  var o=AC.createOscillator(); o.type='sawtooth'; o.frequency.value=f;
  var o2=AC.createOscillator(); o2.type='square'; o2.frequency.value=f*0.5;
  o.connect(lp); o2.connect(lp);
  o.start(t); o2.start(t); o.stop(t+dur+0.05); o2.stop(t+dur+0.05);
}
function lead(f,t,dur,vol){
  var lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=3600; lp.Q.value=1.2;
  var g=AC.createGain();
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  lp.connect(g); g.connect(musicGain); g.connect(spaceIn);
  for(var d=0;d<2;d++){
    var o=AC.createOscillator(); o.type='sawtooth'; o.frequency.value=f;
    o.detune.value=d?8:-8; o.connect(lp); o.start(t); o.stop(t+dur+0.05);
  }
}
function pad(fs,t,dur){
  var lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1500;
  var g=AC.createGain();
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.05,t+0.35);
  g.gain.linearRampToValueAtTime(0.0001,t+dur);
  lp.connect(g); g.connect(musicGain); g.connect(spaceIn);
  for(var i=0;i<fs.length;i++){
    var o=AC.createOscillator(); o.type='sawtooth'; o.frequency.value=fs[i];
    o.detune.value=(i%2?7:-7); o.connect(lp); o.start(t); o.stop(t+dur+0.1);
  }
}
