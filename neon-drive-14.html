/* ---------- menu reaproveitado em início e pausa ---------- */
var OPTDEF=[
  {label:'JOGADORES', opts:['1','2'], get:function(){return numP-1;}, set:setPlayers},
  {label:'DIFICULDADE',opts:['FÁCIL','MÉDIO','DIFÍCIL'],get:function(){return diff;},set:setDiff},
  {label:'CÂMERA',     opts:['EXTERNA','INTERNA'],      get:function(){return camMode;},set:setCam},
  {label:'GRÁFICOS',   opts:['BAIXA','MÉDIA','ALTA'],   get:function(){return quality;},set:setQuality},
  {label:'SOM',        opts:['LIGADO','MUDO'],          get:function(){return muted?1:0;},
   set:function(i){ setMuted(i===1); }}
];
function makeOpt(def,ix){
  var b=document.createElement('button');
  b.type='button'; b.className='opt'; b.textContent=def.opts[ix];
  b._def=def; b._ix=ix;
  b.addEventListener('pointerdown',function(e){
    e.preventDefault(); e.stopPropagation(); def.set(ix); refreshPanels();
  });
  return b;
}
function makeRow(def){
  var row=document.createElement('div'); row.className='row';
  var lb=document.createElement('span'); lb.className='lbl2'; lb.textContent=def.label;
  var sg=document.createElement('span'); sg.className='seg';
  for(var j=0;j<def.opts.length;j++) sg.appendChild(makeOpt(def,j));
  row.appendChild(lb); row.appendChild(sg); return row;
}
function buildPanels(){
  var ids=['menuPanel','pausePanel'], i, j, el;
  for(i=0;i<ids.length;i++){
    el=document.getElementById(ids[i]); if(!el) continue;
    el.innerHTML='';
    for(j=0;j<OPTDEF.length;j++) el.appendChild(makeRow(OPTDEF[j]));
  }
  refreshPanels();
}
function refreshPanels(){
  var bs=document.getElementsByClassName('opt'), i;
  for(i=0;i<bs.length;i++)
    if(bs[i]._def) bs[i].className='opt'+(bs[i]._def.get()===bs[i]._ix?' on':'');
}
function setDiff(i){
  diff=clamp(i,0,DIFFS.length-1);
  NITRO_MAX=DF().nitro;
  nitroCharges=Math.min(nitroCharges,NITRO_MAX);
  if(state==='play'||state==='paused') placeTraffic();
}
function setPlayers(i){
  numP = i?2:1;
  if(numP===2) document.body.classList.add('two');
  else document.body.classList.remove('two');
  COCK=null; applyDrawDist(); updateCameraRig(); resetRun();
  if(state==='play'||state==='paused'){ state='play'; elPause.classList.add('hidden'); }
}
function setCam(i){ camMode=i?1:0; updateCameraRig(); }
function applyDrawDist(){
  var base = quality===2?370:(quality===1?280:190);
  drawDist = (numP===2) ? Math.round(base*0.72) : base;   // 2P renderiza a pista duas vezes
}
function setQuality(i){
  quality=clamp(i,0,2);
  applyDrawDist();
  resize();
}
function setMuted(m){
  muted=!!m;
  if(AC && master) master.gain.setTargetAtTime(muted?0:0.5, AC.currentTime, 0.05);
}
function toMenu(){
  state='menu';
  elOver.classList.add('hidden'); elPause.classList.add('hidden');
  elMenu.classList.remove('hidden'); refreshPanels();
}
var elBinds=document.getElementById('binds'), bindsOpen=false;
function bindLabel(b){
  if(!b) return '—';
  if(b.t==='a') return 'EIXO '+b.i+(b.d>0?' +':' -');
  return PADNAMES[b.i] || ('BOTÃO '+b.i);
}
function mapLabel(k){
  var arr=padMap[k], out=[], i;
  if(!arr||!arr.length) return '—';
  for(i=0;i<arr.length;i++) out.push(bindLabel(arr[i]));
  return out.join(' / ');
}
function padName(){
  if(!gamepadOK) return 'CONTROLE BLOQUEADO NESTE AMBIENTE';
  if(!navigator.getGamepads) return 'CONTROLE NÃO SUPORTADO';
  var gp=firstPad();
  if(!gp) return 'NENHUM CONTROLE DETECTADO';
  return String(gp.id||'CONTROLE').substring(0,40).toUpperCase();
}
function updatePadName(){
  var el=document.getElementById('padName');
  if(el) el.textContent=padName();
}
/* estado do controle no menu: separa "o navegador não expõe" de "o botão não chega" */
var padStatusLast='';
function updatePadStatus(){
  var el=document.getElementById('padStatus'); if(!el) return;
  var txt, list=padList();
  if(!gamepadOK) txt='CONTROLE BLOQUEADO NESTE AMBIENTE';
  else if(!navigator.getGamepads) txt='CONTROLE NÃO SUPORTADO';
  else if(!list.length) txt='NENHUM CONTROLE — APERTE UM BOTÃO NELE';
  else txt=list.length+' CONTROLE'+(list.length>1?'S':'')+
           (padActive>=0?'  ·  RECEBENDO ENTRADA':'  ·  SEM ENTRADA');
  if(txt!==padStatusLast){ padStatusLast=txt; el.textContent=txt; }
}
/* linhas de "quem joga com qual controle". Com 1 jogador ainda aparece a linha
   do jogador 1, que é onde se escolhe entre vários controles conectados. */
function padShort(gp,n){ return 'C'+(n+1); }
function renderPadRows(){
  var host=document.getElementById('padRows'); if(!host) return;
  host.innerHTML='';
  var list=padList();
  if(!list.length){
    var m=document.createElement('div'); m.className='lbl2';
    m.textContent = gamepadOK ? 'NENHUM CONTROLE CONECTADO' : 'CONTROLE BLOQUEADO NESTE AMBIENTE';
    host.appendChild(m); return;
  }
  reanchorAssign(list);
  var slots = (numP===2) ? 2 : 1;
  for(var sI=0;sI<slots;sI++){
    (function(slot){
      var row=document.createElement('div'); row.className='row';
      var lb=document.createElement('span'); lb.className='lbl2';
      lb.textContent='JOGADOR '+(slot+1);
      var sg=document.createElement('span'); sg.className='seg';

      var auto=document.createElement('button');
      auto.type='button';
      auto.className='opt'+(padAssign[slot]===null?' on':'');
      auto.textContent='AUTO';
      auto.addEventListener('pointerdown',function(e){
        e.preventDefault(); e.stopPropagation();
        setPadAssign(slot,null); renderPadRows();
      });
      sg.appendChild(auto);

      for(var j=0;j<list.length;j++){
        (function(gp,n){
          var b=document.createElement('button');
          b.type='button';
          var mine=(padAssign[slot]===gp.index);
          var other=(padAssign[1-slot]===gp.index);
          b.className='opt'+(mine?' on':'')+(gp.index===padActive?' live':'');
          b.textContent=padShort(gp,n)+(gp.index===padActive?' •':'');
          b.disabled=other;
          b.addEventListener('pointerdown',function(e){
            e.preventDefault(); e.stopPropagation();
            if(other) return;
            setPadAssign(slot,gp.index); renderPadRows();
          });
          sg.appendChild(b);
        })(list[j],j);
      }
      row.appendChild(lb); row.appendChild(sg); host.appendChild(row);

      // nome do controle que está valendo para este jogador
      var eff=padForSlot(slot);
      var hint=document.createElement('div'); hint.className='padhint';
      hint.textContent = eff ? String(eff.id||'CONTROLE').substring(0,34).toUpperCase()
                             : 'SEM CONTROLE';
      host.appendChild(hint);
    })(sI);
  }
}
function renderBinds(){
  var el=document.getElementById('bindPanel'); if(!el) return;
  el.innerHTML='';
  for(var i=0;i<PADACT.length;i++){
    (function(act){
      var row=document.createElement('div'); row.className='row';
      var lb=document.createElement('span'); lb.className='lbl2'; lb.textContent=act.n;
      var sg=document.createElement('span'); sg.className='seg';
      var b=document.createElement('button');
      b.type='button';
      b.className='opt'+(capturing===act.k?' on':'');
      b.textContent=(capturing===act.k)?'PRESSIONE...':mapLabel(act.k);
      b.addEventListener('pointerdown',function(e){
        e.preventDefault(); e.stopPropagation();
        capturing=(capturing===act.k)?null:act.k;
        captureBlock=null; renderBinds();
      });
      sg.appendChild(b); row.appendChild(lb); row.appendChild(sg); el.appendChild(row);
    })(PADACT[i]);
  }
  renderPadRows();
  updatePadName();
}
function openBinds(from){
  bindsFrom=from; bindsOpen=true; capturing=null; captureBlock=null;
  (from==='pause'?elPause:elMenu).classList.add('hidden');
  elBinds.classList.remove('hidden');
  renderBinds();
}
function closeBinds(){
  bindsOpen=false; capturing=null; captureBlock=null;
  elBinds.classList.add('hidden');
  (bindsFrom==='pause'?elPause:elMenu).classList.remove('hidden');
}
function bindBtn(id,fn){
  var el=document.getElementById(id); if(!el) return;
  el.addEventListener('pointerdown',function(e){ e.preventDefault(); e.stopPropagation(); fn(); });
}
bindBtn('btnStart',  function(){ startRun(); });
bindBtn('btnResume', function(){ togglePause(); });
bindBtn('btnRestart',function(){ startRun(); });
bindBtn('btnAgain',  function(){ startRun(); });
bindBtn('btnMenu',   toMenu);
bindBtn('btnBinds',  function(){ openBinds('menu'); });
bindBtn('btnBinds2', function(){ openBinds('pause'); });
bindBtn('btnBindsBack', closeBinds);
bindBtn('btnBindsDef',  function(){ padMap=defaultMap(); capturing=null; saveMap(); renderBinds(); });

function startRun(){
  try{ initAudio(); if(AC && AC.state==='suspended'){ var pr=AC.resume(); if(pr&&pr.catch) pr.catch(function(){}); } }
  catch(e){ AC=null; report(e); }
  resetRun();
  state='play';
  elMenu.classList.add('hidden');
  elOver.classList.add('hidden');
  elPause.classList.add('hidden');
}
function endRun(){
  state='over';
  ensurePlayers();
  var s0=Math.floor(players[0].score);
  var s1=(numP===2)?Math.floor(players[1].score):0;
  bestScore=Math.max(bestScore,s0,s1);
  if(numP===2){
    elFinal.textContent = s0.toLocaleString('pt-BR')+'   ·   '+s1.toLocaleString('pt-BR');
    elStats.textContent = (s0===s1?'EMPATE':(s0>s1?'JOGADOR 1 VENCE':'JOGADOR 2 VENCE'))+'  ·  '+DF().name;
  } else {
    elFinal.textContent = s0.toLocaleString('pt-BR');
    elStats.textContent = DF().name+'  ·  '+(players[0].distance/1000).toFixed(1)+' km  ·  volta '+
                          players[0].laps+'  ·  recorde '+bestScore.toLocaleString('pt-BR');
  }
  elOver.classList.remove('hidden');
}
function togglePause(){
  if(state==='play'){ state='paused'; elPause.classList.remove('hidden'); refreshPanels(); }
  else if(state==='paused'){ state='play'; elPause.classList.add('hidden'); }
}
function toggleCam(){ setCam(camMode?0:1); refreshPanels(); }
function cycleQuality(){ setQuality((quality+1)%3); }

/* ---------- loop ---------- */
var last=0, acc=0, safeMode=false, errShown=false;
function report(e){
  if(errShown) return; errShown=true;
  if(window.__err) window.__err('ERRO DE EXECUÇÃO:\n'+((e&&e.stack)?e.stack:String(e)));
}
function frame(t){
  requestAnimationFrame(frame);
  try { tick(t); } catch(e){ report(e); safeMode=true; }
}
function tick(t){
  if(!last) last=t;
  var dt=(t-last)/1000; last=t;
  if(dt>0.25) dt=0.25;
  acc+=dt;
  pollPadSystem();
  pollCapture();
  var mexeu=pollPadActivity();
  if(bindsOpen){ updatePadName(); if(mexeu) renderPadRows(); }
  if(state==='menu') updatePadStatus();
  var guard=0, pu;
  while(acc>=STEP && guard<5){
    if(state!=='paused'){
      ensurePlayers();
      for(pu=0; pu<numP; pu++){
        curP=pu; loadP(players[pu]);
        try{ update(STEP); }catch(e){ report(e); }
        players[pu].gas = ctrl.gas?1:0;
        saveP(players[pu]);
      }
      if(state==='play'){
        var alive=0;
        for(pu=0; pu<numP; pu++) if(!players[pu].dead) alive++;
        if(!alive) endRun();
      }
    }
    acc-=STEP; guard++;
  }
  if(acc>STEP) acc=0;
  render();
  if(AC){ try{ scheduleMusic(); updateEngine(dt); }catch(e){ report(e); } }
}

/* ---------- inicialização ---------- */
function boot(){
  buildSprites();
  buildRidges();
  buildStars();
  loadMap(); loadAssign();
  buildTrack();
  resetRun();
  buildPanels();
  applyDrawDist();
  resize();
  updatePalette(dayPhase);
  requestAnimationFrame(frame);
}
var rzT=null;
window.addEventListener('resize', function(){
  if(rzT) clearTimeout(rzT);
  rzT=setTimeout(function(){ rzT=null; resize(); }, 130);   // agrupa a enxurrada de resize da barra de URL
});
window.addEventListener('orientationchange', function(){ setTimeout(resize,200); });
document.addEventListener('visibilitychange', function(){
  if(document.hidden && state==='play') togglePause();
});
try{ boot(); }
catch(e){ if(window.__err) window.__err('ERRO NA INICIALIZAÇÃO:\n'+((e&&e.stack)?e.stack:String(e))); }

})();
</script>
